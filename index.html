<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Expedientes & QR - CREDIBAN V23 Cloud</title>
    
    <!-- Librerías Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librerías para PDF Nativo (Reportes con Logo y Hojas A4 de Tickets QR Exactos) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Librerías para Escáner QR por Hardware y Generador QR HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .tab-active { border-bottom: 3px solid #59B447; color: #59B447; font-weight: bold; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.22s ease-out forwards; }
        .modal-bg { animation: fadeIn 0.18s ease-out forwards; }
        
        .login-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: relative; overflow: hidden; }
        .login-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(89,180,71,0.05) 0%, rgba(0,0,0,0) 70%); }

        #qr-reader-box video {
            width: 100% !important;
            border-radius: 12px !important;
            object-fit: cover !important;
        }

        .print-area {
            width: 210mm !important;
            min-width: 210mm !important;
            max-width: 210mm !important;
            box-sizing: border-box !important;
        }
        .ticket-name-text {
            word-break: normal !important;
            overflow-wrap: normal !important;
            hyphens: none !important;
        }

        @media print {
            @page { size: A4 portrait; margin: 4mm; }
            html, body, #root, main { 
                height: auto !important; min-height: 0 !important; overflow: visible !important; 
                display: block !important; background: white !important; margin: 0 !important; padding: 0 !important;
            }
            .no-print { display: none !important; }
            .print-container { padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            .print-area { 
                margin: 0 auto !important; width: 200mm !important; min-width: 200mm !important; max-width: 200mm !important;
                border-left: 2px solid black !important; border-top: 2px solid black !important;
                box-shadow: none !important; page-break-after: always; box-sizing: border-box !important;
            }
            .text-red-600 { color: #dc2626 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ticket-cell { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // =========================================================================
        // 1. URL DEL SCRIPT DE BASE DE DATOS DE EXPEDIENTES Y CLAVES DE SESIÓN
        // =========================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwHEPrFeiFPsB0z1SsTeO2KKfXoSVcZsjxLbQ_UjREyTEI28edgnZDLGnTB0Z7PqTRs/exec";
        const SESSION_STORAGE_KEY = "crediban_v23_active_session";
        const CACHE_STORAGE_PREFIX = "crediban_v23_cache_";

        const leerSesionGuardada = () => {
            try {
                const raw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (parsed && parsed.usuario && parsed.password && parsed.rol) return parsed;
            } catch (e) {}
            return null;
        };

        const leerCacheSede = (sede) => {
            try {
                const raw = localStorage.getItem(CACHE_STORAGE_PREFIX + (sede || "HUACHO"));
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        };

        // =========================================================================
        // 2. MOTOR DE AUDIO POTENTE (INTACTO): CAJA REGISTRADORA + SIRENA DE ERROR
        // =========================================================================
        let sharedAudioCtx = null;
        const getAudioContext = () => {
            if (!sharedAudioCtx) {
                sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume();
            }
            return sharedAudioCtx;
        };

        const playSound = (type) => {
            try {
                const ctx = getAudioContext();
                const compressor = ctx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, ctx.currentTime);
                compressor.knee.setValueAtTime(10, ctx.currentTime);
                compressor.ratio.setValueAtTime(12, ctx.currentTime);
                compressor.connect(ctx.destination);

                const playDualTone = (f1, f2, start, duration, wave = 'square', vol = 0.95) => {
                    [f1, f2].forEach(freq => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = wave;
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                        gain.gain.setValueAtTime(vol, ctx.currentTime + start);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + duration);
                        osc.connect(gain);
                        gain.connect(compressor);
                        osc.start(ctx.currentTime + start);
                        osc.stop(ctx.currentTime + start + duration);
                    });
                };

                if (type === 'beep') {
                    playDualTone(2100, 2750, 0, 0.06, 'square', 0.95);
                    playDualTone(2650, 3300, 0.06, 0.14, 'triangle', 0.98);
                    if (navigator.vibrate) navigator.vibrate(45);
                } else if (type === 'duplicate') {
                    playDualTone(520, 680, 0, 0.16, 'sawtooth', 0.95);
                    playDualTone(420, 560, 0.20, 0.22, 'sawtooth', 0.95);
                    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                } else if (type === 'alert') {
                    playDualTone(260, 310, 0, 0.25, 'sawtooth', 0.98);
                    playDualTone(190, 240, 0.28, 0.38, 'sawtooth', 0.98);
                    if (navigator.vibrate) navigator.vibrate([250, 80, 250]);
                }
            } catch (e) {}
        };

        // =========================================================================
        // 3. NORMALIZADORES DUALES, RUBROS (INDIVIDUAL/GRUPAL) E INMUNIDAD
        // =========================================================================
        const normalizarIdNatural = (raw) => {
            const str = String(raw || '').trim().toUpperCase();
            if (!str) return '';
            const sinPrefijo = str.replace(/^GRP-/, '');
            const parteFinal = sinPrefijo.includes('-') ? sinPrefijo.split('-').pop() : sinPrefijo;
            const soloNum = parteFinal.replace(/\D/g, '');
            if (!soloNum) return sinPrefijo;
            return String(parseInt(soloNum, 10));
        };

        const formatearConCeros = (raw, rubro = 'INDIVIDUAL') => {
            const nat = normalizarIdNatural(raw);
            const soloNum = nat.replace(/\D/g, '');
            if (!soloNum) return '';
            const base = "001-" + soloNum.padStart(5, '0');
            return String(rubro || 'INDIVIDUAL').toUpperCase() === 'GRUPAL' ? `GRP-${base}` : base;
        };

        const normalizarRubro = (rubroRaw) => {
            const r = String(rubroRaw || 'INDIVIDUAL').toUpperCase().trim();
            return r === 'GRUPAL' ? 'GRUPAL' : 'INDIVIDUAL';
        };

        // Clave única compuesta: permite que Individual N° 15 y Grupal N° 15 coexistan sin colisión
        const obtenerClaveUnicaExp = (exp) => {
            if (!exp) return '';
            return `${normalizarRubro(exp.rubro)}::${normalizarIdNatural(exp.id)}`;
        };

        // Determina si un expediente tiene INMUNIDAD (Archivo Externo / Almacén Secundario)
        const esExpedienteInmune = (exp, categoriasInmunes = []) => {
            if (!exp) return false;
            const override = String(exp.inmunidadManual || 'AUTO').toUpperCase();
            if (override === 'INMUNE') return true;
            if (override === 'NORMAL') return false;
            const est = String(exp.estadoCredito || '').toUpperCase().trim();
            return Array.isArray(categoriasInmunes) && categoriasInmunes.map(c => String(c).toUpperCase().trim()).includes(est);
        };

        // Contabilizado físicamente en la sesión actual
        const estaContabilizadoFisicoEnSesion = (exp) => {
            if (!exp) return false;
            return Boolean(exp.invFecha && String(exp.invFecha).trim() !== '');
        };

        // Considerado "HABIDO" en el inventario general (escaneado físicamente O con inmunidad de archivo externo)
        const estaHabidoEnInventario = (exp, categoriasInmunes = []) => {
            return estaContabilizadoFisicoEnSesion(exp) || esExpedienteInmune(exp, categoriasInmunes);
        };

        // Filtra nombres inválidos (como la cabecera literal "ASESOR")
        const limpiarListaAsesores = (lista) => {
            const invalidos = new Set(['', 'ASESOR', 'ASESORES', 'NOMBRE', 'USUARIO', 'TRABAJADOR', 'PERSONAL', 'NINGUNO', 'NULL', 'UNDEFINED']);
            const unicos = [];
            (lista || []).forEach(item => {
                const limpio = String(item || '').toUpperCase().trim();
                if (limpio && !invalidos.has(limpio) && !unicos.includes(limpio)) {
                    unicos.push(limpio);
                }
            });
            return unicos.sort((a, b) => a.localeCompare(b));
        };

        const calcularFontSizeOptimo = (nombreCompleto, manualSize, qrPos) => {
            if (manualSize > 0) return manualSize;
            const palabras = String(nombreCompleto || '').trim().split(/\s+/);
            const maxPalabra = palabras.reduce((max, p) => Math.max(max, p.length), 0);
            const totalLen = String(nombreCompleto || '').length;

            if (qrPos === 'ARRIBA') return totalLen > 24 ? 8.5 : 10;
            if (maxPalabra >= 12 || totalLen >= 30) return 8.5;
            if (maxPalabra >= 10 || totalLen >= 22) return 9.5;
            if (maxPalabra >= 8 || totalLen >= 16) return 10.5;
            return 11.5;
        };

        const dividirEnLineasSeguras = (nombreCompleto, maxCharsPorLinea = 12) => {
            const palabras = String(nombreCompleto || '').trim().split(/\s+/).filter(Boolean);
            const lineas = [];
            let actual = '';
            palabras.forEach(p => {
                if (!actual) {
                    actual = p;
                } else if ((actual.length + 1 + p.length) <= maxCharsPorLinea) {
                    actual += ' ' + p;
                } else {
                    lineas.push(actual);
                    actual = p;
                }
            });
            if (actual) lineas.push(actual);
            return lineas.slice(0, 4);
        };

        const clasificarRolSistema = (cargoRaw) => {
            const c = String(cargoRaw || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
            if (c.includes("GERENTE") || c.includes("GERENCIA") || c.includes("DIRECTOR") || c.includes("SUPERADMIN")) return "GERENTE";
            if (c.includes("ADMIN") || c.includes("SUPERVISOR") || c.includes("JEFE") || c.includes("COORDINADOR")) return "ADMINISTRADOR";
            if (c.includes("CAJERO") || c.includes("CAJERA") || c.includes("CAJA") || c.includes("ARCHIVO")) return "CAJERO";
            if (c.includes("ASESOR") || c.includes("ANALISTA") || c.includes("PROMOTOR") || c === "TRABAJADOR") return "ASESOR";
            return "OTRO_PERSONAL";
        };

        // Genera imagen PNG Base64 del Logo Oficial CREDIBAN para incrustar en reportes PDF
        const generarLogoCredibanBase64 = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 420;
                canvas.height = 120;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(10, 6);
                ctx.scale(0.45, 0.45);
                ctx.fillStyle = '#59B447';

                const drawRoundRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.arcTo(x + w, y, x + w, y + h, r);
                    ctx.arcTo(x + w, y + h, x, y + h, r);
                    ctx.arcTo(x, y + h, x, y, r);
                    ctx.arcTo(x, y, x + w, y, r);
                    ctx.closePath();
                    ctx.fill();
                };

                drawRoundRect(90, 8, 24, 13, 6.5);
                drawRoundRect(71, 31, 61, 13, 6.5);
                drawRoundRect(50, 55, 74, 13, 6.5);
                drawRoundRect(31, 79, 75, 13, 6.5);
                drawRoundRect(24, 103, 63, 13, 6.5);

                const p = new Path2D("M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z");
                ctx.fill(p);
                ctx.restore();

                ctx.fillStyle = '#59B447';
                ctx.font = 'bold 46px Georgia, serif';
                ctx.fillText('CREDIBAN', 102, 66);

                ctx.fillStyle = '#475569';
                ctx.font = 'bold 14px Arial, sans-serif';
                ctx.fillText('CONTROL DE EXPEDIENTES & ARCHIVO', 104, 88);

                return canvas.toDataURL('image/png');
            } catch (e) {
                return null;
            }
        };

        function QRCodeCanvas({ value, size = 70 }) {
            const canvasRef = React.useRef(null);
            React.useEffect(() => {
                if (canvasRef.current && window.QRious) {
                    const hdSize = Math.max(240, size * 3);
                    new window.QRious({
                        element: canvasRef.current,
                        value: value || '001-00000',
                        size: hdSize,
                        level: 'L',
                        background: '#ffffff',
                        foreground: '#000000',
                        padding: Math.round(hdSize * 0.08)
                    });
                }
            }, [value, size]);
            return (
                <div className="bg-white inline-flex items-center justify-center shrink-0" style={{ width: `${size}px`, height: `${size}px` }}>
                    <canvas ref={canvasRef} style={{ width: `${size}px`, height: `${size}px`, imageRendering: 'pixelated' }} />
                </div>
            );
        }

        function HelpButton({ title, steps, onOpen }) {
            return (
                <button
                    type="button"
                    onClick={() => onOpen({ title, steps })}
                    title="Ver guía paso a paso"
                    className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white text-[11px] font-black transition-colors ml-1.5 shadow-sm"
                >
                    <i className="fa-solid fa-info"></i>
                </button>
            );
        }

        function App() {
            const sesionInicial = React.useMemo(() => leerSesionGuardada(), []);
            const cacheInicial = React.useMemo(() => sesionInicial ? leerCacheSede(sesionInicial.sede) : null, [sesionInicial]);

            // =====================================================================
            // ESTADOS DE SEGURIDAD, SESIÓN PERSISTENTE Y CATÁLOGOS MAESTROS
            // =====================================================================
            const [isAuth, setIsAuth] = React.useState(() => Boolean(sesionInicial));
            const [isLoading, setIsLoading] = React.useState(false);
            const [loadingMsg, setLoadingMsg] = React.useState('');
            const [bgSyncing, setBgSyncing] = React.useState(false);
            const [loginErrorMsg, setLoginErrorMsg] = React.useState('');
            const [helpModal, setHelpModal] = React.useState(null);

            const [rememberPass, setRememberPass] = React.useState(() => localStorage.getItem('crediban_v23_remember') !== 'false');
            const [showPassLogin, setShowPassLogin] = React.useState(false);
            const [usuarioInput, setUsuarioInput] = React.useState(() => sesionInicial?.usuario || localStorage.getItem('crediban_v23_user') || '');
            const [passwordInput, setPasswordInput] = React.useState(() => {
                if (sesionInicial?.password) return sesionInicial.password;
                return localStorage.getItem('crediban_v23_remember') !== 'false'
                    ? (localStorage.getItem('crediban_v23_pass') || '')
                    : '';
            });

            const [sedesDisponibles, setSedesDisponibles] = React.useState(() => cacheInicial?.parametros?.sedes || ["HUACHO", "HUARAZ", "ICA", "HUANUCO"]);
            const [estadosDisponibles, setEstadosDisponibles] = React.useState(() => cacheInicial?.parametros?.estadosCredito || ["ACTIVO", "MORA DURA", "CANCELADO", "LISTA NEGRA", "JUDICIAL", "REPROGRAMADO"]);
            const [categoriasInmunes, setCategoriasInmunes] = React.useState(() => cacheInicial?.parametros?.categoriasInmunes || ["CANCELADO", "LISTA NEGRA"]);
            const [ubicacionesDisponibles, setUbicacionesDisponibles] = React.useState(() => cacheInicial?.parametros?.ubicaciones || ["CAJA (ARCHIVO)", "ALMACÉN EXTERNO (INMUNE)", "EN COMITÉ", "AUDITORÍA", "ARCHIVO CENTRAL"]);

            // Usuarios activos del Script Maestro de Usuarios + permisos individuales configurados por Gerencia
            const [usuariosSistema, setUsuariosSistema] = React.useState(() => cacheInicial?.parametros?.usuariosSistema || []);
            const [permisosUsuariosMap, setPermisosUsuariosMap] = React.useState(() => cacheInicial?.parametros?.permisosUsuarios || {});
            const [permisoExportarPdfActual, setPermisoExportarPdfActual] = React.useState(() => Boolean(sesionInicial?.permisoPdf));

            const [sedeActual, setSedeActual] = React.useState(() => sesionInicial?.sede || localStorage.getItem('crediban_v23_sede') || 'HUACHO');
            const [operadorNombre, setOperadorNombre] = React.useState(() => sesionInicial?.nombre || '');
            const [operadorUsuario, setOperadorUsuario] = React.useState(() => sesionInicial?.usuario || '');
            const [rolSistema, setRolSistema] = React.useState(() => sesionInicial?.rol || '');

            // Matriz de Permisos Dinámica:
            const esGerente = rolSistema === 'GERENTE';
            const esAdmin = rolSistema === 'ADMINISTRADOR';
            const esCajero = rolSistema === 'CAJERO';
            const puedeOperarCaja = esCajero || esAdmin || esGerente;
            const puedeGestionarBase = esCajero || esAdmin || esGerente;
            const puedeEditarBase = esCajero || esAdmin || esGerente;
            const puedeExportarPDF = esGerente || permisoExportarPdfActual;
            const puedeExportarCSV = esGerente || permisoExportarPdfActual;

            // Prestar / Devolver es la primera pestaña y vista por defecto
            const [view, setView] = React.useState(() => {
                if (sesionInicial) {
                    return sesionInicial.rol === 'ADMINISTRADOR' ? 'dashboard' : 'movimientos';
                }
                return 'movimientos';
            });

            // asesoresActivos = SOLO personal activo del Script de Usuarios (para Prestar/Devolver)
            const [asesoresActivos, setAsesoresActivos] = React.useState(() => cacheInicial?.asesoresActivos || []);
            const [expedientes, setExpedientes] = React.useState(() => cacheInicial?.expedientes || []);
            const [ticketsQueue, setTicketsQueue] = React.useState(() => {
                try {
                    const raw = localStorage.getItem('crediban_tickets_queue');
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            });

            // ESTADO DE CIERRE OFICIAL DE INVENTARIO DE LA SEDE
            const [cierreInfo, setCierreInfo] = React.useState(() => cacheInicial?.cierreInfo || { cerrado: false });
            const [modalCierreInv, setModalCierreInv] = React.useState(false);
            const [passCierreInput, setPassCierreInput] = React.useState('');
            const [obsCierreInput, setObsCierreInput] = React.useState('INVENTARIO FÍSICO CONFORME');

            // CONFIGURACIÓN DE IMPRESIÓN A4
            const [printConfig, setPrintConfig] = React.useState(() => {
                const saved = localStorage.getItem('crediban_v23_print_cfg');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return {
                    qrSize: 70,
                    qrPosition: 'IZQUIERDA',
                    qrDataMode: 'COMPACTO',
                    formatoCodigoRojo: 'CEROS',
                    fontSizeCliente: 0,
                    fontSizeCodigo: 24,
                    ticketHeightMm: 40,
                    showHeaderSede: true
                };
            });

            React.useEffect(() => {
                localStorage.setItem('crediban_v23_print_cfg', JSON.stringify(printConfig));
            }, [printConfig]);

            // ESTADOS DEL ESCÁNER QR Y PROTECCIÓN DE CONTEO EN VIVO (LECTOR INTACTO)
            const [scanMode, setScanMode] = React.useState('INVENTARIO');
            const [asesorLote, setAsesorLote] = React.useState('');
            const [cameraActive, setCameraActive] = React.useState(false);
            const [camerasList, setCamerasList] = React.useState([]);
            const [selectedCamId, setSelectedCamId] = React.useState('');
            const [torchOn, setTorchOn] = React.useState(false);
            const [scanFeedback, setScanFeedback] = React.useState(null);
            const [scanLog, setScanLog] = React.useState([]);
            const [alertasEscaneo, setAlertasEscaneo] = React.useState([]);
            const [liveSyncActive, setLiveSyncActive] = React.useState(true);
            const [lastSyncTime, setLastSyncTime] = React.useState(() => cacheInicial?.savedAt || '');
            const [lectorFisicoInput, setLectorFisicoInput] = React.useState('');

            // Filtros en la Tabla de Inventario en Vivo + BLOQUES DIGITABLES Y FIJABLES POR SEDE
            const [liveTableSearch, setLiveTableSearch] = React.useState('');
            const [bloqueTamano, setBloqueTamano] = React.useState(() => {
                const sInit = sesionInicial?.sede || localStorage.getItem('crediban_v23_sede') || 'HUACHO';
                const saved = parseInt(localStorage.getItem(`crediban_v23_bloque_${sInit}`), 10);
                return (!isNaN(saved) && saved >= 1) ? saved : 50;
            });
            const [bloqueTamanoInput, setBloqueTamanoInput] = React.useState(() => {
                const sInit = sesionInicial?.sede || localStorage.getItem('crediban_v23_sede') || 'HUACHO';
                const saved = parseInt(localStorage.getItem(`crediban_v23_bloque_${sInit}`), 10);
                return (!isNaN(saved) && saved >= 1) ? String(saved) : '50';
            });
            const [bloqueFijadoInfo, setBloqueFijadoInfo] = React.useState('');
            const [bloqueDesde, setBloqueDesde] = React.useState('');
            const [bloqueHasta, setBloqueHasta] = React.useState('');
            const [soloFaltantesBloque, setSoloFaltantesBloque] = React.useState(false);
            const [modoAuditoriaInmunes, setModoAuditoriaInmunes] = React.useState(false);

            // Caché temporal de escaneos locales (15 seg) para evitar parpadeo de conteo
            const recentLocalScansRef = React.useRef({});
            const html5QrInstanceRef = React.useRef(null);
            const lastScannedRef = React.useRef({ code: '', time: 0 });
            const expedientesRef = React.useRef(expedientes);
            const scanModeRef = React.useRef(scanMode);
            const asesorLoteRef = React.useRef(asesorLote);
            const operadorRef = React.useRef(operadorNombre);
            const operadorUsuarioRef = React.useRef(operadorUsuario);
            const sedeRef = React.useRef(sedeActual);

            // Cierre de sesión inmediato (manual o forzado por cambio de contraseña/permisos)

            // Al recargar con sesión guardada: entra al instante y valida contraseña + refresca datos en segundo plano
            React.useEffect(() => {

            React.useEffect(() => {

            // =====================================================================

            const handleLogin = async (e) => {

                    const accesoPorDefecto = (rolClasificado === 'GERENTE' || rolClasificado === 'ADMINISTRADOR' || rolClasificado === 'CAJERO');
                    const tieneAcceso = rolClasificado === 'GERENTE'
                        ? true
                        : (typeof permUsuario.accesoSistema === 'boolean' ? permUsuario.accesoSistema : accesoPorDefecto);

                    localStorage.setItem('crediban_v23_user', usuarioInput.trim());
                    localStorage.setItem('crediban_v23_remember', rememberPass ? 'true' : 'false');
                    if (rememberPass) {
                        localStorage.setItem('crediban_v23_pass', passwordInput.trim());
                    } else {
                        localStorage.removeItem('crediban_v23_pass');

                    const sedeDetectada = data.sede || userObj.sedeActiva || 'HUACHO';
                    const nombreFinal = userObj.nombreCorto || userObj.nombre || userKey;
                    setSedeActual(sedeDetectada);
                    localStorage.setItem('crediban_v23_sede', sedeDetectada);

                    // Guardar sesión activa para que no pida login ni espere carga al recargar la página
                    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({

                        nombre: nombreFinal,

                        sede: sedeDetectada,
                        permisoPdf: puedePdf,

                    }));

                    if (!isNaN(localBloque) && localBloque >= 1) {

                    setOperadorUsuario(userKey);

                    setPermisoExportarPdfActual(puedePdf);

                    if (data.parametros) aplicarCatalogoParametros(data.parametros, sedeDetectada);
                    if (Array.isArray(data.asesoresActivos || data.asesores)) {

            // SINCRONIZACIÓN EN VIVO CADA 3 SEGUNDOS
            React.useEffect(() => {

                const timer = setInterval(async () => {
                    try {

                            setLastSyncTime(new Date().toLocaleTimeString());

                }, 3000);
                return () => clearInterval(timer);
            }, [isAuth, liveSyncActive, view]);const syncExpedienteCloud = async (expToSave, silent = false, checkDuplicateInv = false) => {
                if (!silent) {
                    setIsLoading(true);
                    setLoadingMsg('Sincronizando con Google Sheets...');
                }
                try {

                    });
                    if (!silent) setIsLoading(false);
                    return data;

                        setIsLoading(false);
