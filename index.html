                        {inmune && (
                            <span className="px-1.5 py-0.5 rounded text-[9px] font-black bg-indigo-100 text-indigo-800 border border-indigo-300" title="Almacén Externo: Considerado Habido en Inventario">
                                <i className="fa-solid fa-shield-halved mr-0.5"></i> INMUNE
                            </span>

                    </span>

            };

            const BadgeRubro = ({rubro}) => {

                    ? <span className="px-1.5 py-0.5 rounded text-[9px] font-black bg-purple-600 text-white ml-1">GRUPAL</span>

            const ModalHistorial = ({ exp, onClose }) => (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 modal-bg no-print">

                            </div>
                            <h1 className="text-[#59B447] font-bold text-3xl tracking-widest mb-1" style={{ fontFamily: "Georgia" }}>CREDIBAN</h1>
                            <p className="text-slate-400 text-xs tracking-wider uppercase mb-2">Control de Expedientes & QR (V23)</p>
                            <div className="inline-flex items-center gap-1.5 bg-slate-800/80 border border-slate-700 text-slate-300 text-[10px] font-bold px-3 py-1 rounded-full mb-6">
                                <i className="fa-solid fa-shield-halved text-[#59B447]"></i>
                                Acceso: Cajeros • Administradores • Gerentes y Autorizados
                            </div>

                            {loginErrorMsg && (
                                <div className="bg-red-500/20 border border-red-500 text-red-200 text-xs font-bold p-3.5 rounded-2xl mb-4 text-left">
                                    {loginErrorMsg}
                                </div>
                            )}
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="text-left">

            // =====================================================================

                            <div className="bg-white p-6 rounded-2xl shadow-2xl flex items-center gap-4">
                                <i className="fa-solid fa-circle-notch fa-spin text-[#59B447] text-2xl"></i>

                    {helpModal && <ModalAyudaTutorial info={helpModal} onClose={() => setHelpModal(null)} />}
                    {historialVisible && <ModalHistorial exp={historialVisible} onClose={() => setHistorialVisible(null)} />}
                    {modalIntegrantesVisible && <ModalIntegrantesGrupo exp={modalIntegrantesVisible} onClose={() => setModalIntegrantesVisible(null)} />}

                                        <div className="bg-green-100 p-2 rounded-xl">

                                        </div>
                                        <div className="bg-indigo-100 p-2 rounded-xl">

                                        </div>

                                            <p className="text-lg font-black text-amber-800">{expedientes.length - totalHabidosInventario}</p>
                                        </div>
                                    </div>

                                    {desglosePorCajeroVivo.length > 0 && (

                                                    <span key={cj} className="bg-white border border-slate-300 px-2.5 py-1 rounded-lg text-xs font-bold text-slate-700">
                                                        <i className="fa-solid fa-user-check text-[#59B447] mr-1"></i> {cj}: <span className="font-black text-slate-900">{cant}</span>
                                                    </span>
                                                ))}
                                            </div>
                                        </div>

                                        <label className="block text-[10px] font-black text-slate-500 uppercase mb-1">Observación de Cierre</label>

                                            <i className="fa-solid fa-file-signature text-[#59B447] mr-1"></i> Firmar y Cerrar Inventario
                                        </button>
                                    </div>
                                </form>

                        </div>

                                    <i className="fa-solid fa-chart-pie mr-1.5"></i> Resumen Global Ejecutivo (Totales)

                                <button onClick={() => setModalReporte(false)} className="text-xs text-slate-400 font-bold underline">Cancelar</button>
                            </div>
                        </div>

                                <div className="flex items-center gap-2 sm:gap-3 flex-wrap">

                                        <span className="bg-blue-100 text-blue-800 text-[11px] font-black px-2.5 py-1 rounded-lg">
                                            <i className="fa-solid fa-building mr-1"></i> Sede: {sedeActual}

                                        <i className="fa-solid fa-user-shield mr-1"></i> {operadorNombre} ({rolSistema})
                                    </span>
                                </div>

                                <div className="flex gap-2 items-center">
                                    <button onClick={() => setLiveSyncActive(!liveSyncActive)} className={`px-2.5 py-1.5 rounded text-[10px] font-bold border ${liveSyncActive ? 'bg-green-50 text-green-700 border-green-300' : 'bg-slate-100 text-slate-500 border-slate-300'}`}>
                                        <i className={`fa-solid fa-rotate ${(liveSyncActive || bgSyncing) ? 'fa-spin' : ''} mr-1`}></i>

                                    {puedeExportarCSV && (
                                        <button onClick={() => exportarCSV(false)} className="bg-slate-800 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm hover:bg-slate-700">
                                            <i className="fa-solid fa-file-csv mr-1"></i> Exportar Todo CSV
                                        </button>
                                    )}

                                    <button onClick={() => cerrarSesion()} className="bg-red-50 text-red-600 px-3 py-1.5 rounded text-xs font-bold shadow-sm hover:bg-red-100" title="Cerrar Sesión">
                                        <i className="fa-solid fa-power-off"></i>
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-5 text-xs font-semibold text-slate-500 overflow-x-auto">
                                {puedeOperarCaja && (

                                    </button>
                                )}
                                {puedeOperarCaja && (
                                    <button onClick={()=>setView('escaner')} className={`pb-2 whitespace-nowrap ${view==='escaner'?'tab-active':''}`}>
                                        <i className="fa-solid fa-qrcode mr-1"></i> Escáner QR Ráfaga
                                    </button>
                                )}
                                <button onClick={()=>setView('dashboard')} className={`pb-2 whitespace-nowrap ${view==='dashboard'?'tab-active':''}`}>
                                    <i className="fa-solid fa-magnifying-glass-chart mr-1"></i> Buscador, Historial & Filtros ({sedeActual})
                                </button>
                                {puedeGestionarBase && (
                                    <button onClick={()=>setView('inventario')} className={`pb-2 whitespace-nowrap ${view==='inventario'?'tab-active':''}`}>

                                    </button>
                                )}
                                {puedeOperarCaja && (
                                    <button onClick={()=>setView('tickets')} className={`pb-2 whitespace-nowrap ${view==='tickets'?'tab-active':''}`}>
                                        <i className="fa-solid fa-tags mr-1"></i> Generador Masivo QR (A4)

                                        <span className="bg-[#59B447] text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">Cierre Oficial Registrado</span>

                                    <p className="text-sm font-black mt-1">

                                            "Escribe el número natural del expediente (ej. 8), el código completo (001-00008 / GRP-001-00008), el nombre del cliente o de algún integrante del grupo.",
                                            "Toca el expediente en la lista desplegable.",
                                            "Para préstamos, la lista desplegable muestra exclusivamente a los Asesores Activos sincronizados desde el Script de Usuarios."
                                        ]}
                                        onOpen={setHelpModal}
                                    />
                                </div>
                                <div className="glass-card p-6 rounded-2xl mb-6 border-l-4 border-blue-500 relative z-20">
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Buscar Cliente, Grupo o N° Expediente</label>
                                    <div className="relative">
                                        <input type="text" value={movBusqueda} onChange={handleLiveSearch} className="w-full p-3 border border-blue-200 rounded-xl outline-none font-bold bg-white text-blue-900 shadow-inner focus:ring-2 focus:ring-blue-400" placeholder="Ej: CARLOS, GRUPO LAS FLORES o 8..." />

                                                {sugerencias.map(s => (
                                                    <div key={obtenerClaveUnicaExp(s)} onClick={() => seleccionarExpediente(s)} className="p-3 border-b border-slate-50 hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors">
                                                        <div>
                                                            <div className="flex items-center">
                                                                <p className="font-bold text-sm text-slate-800">{s.cliente}</p>
                                                                <BadgeRubro rubro={s.rubro} />
                                                            </div>
                                                            <p className="text-[10px] text-slate-500">
                                                                EXP: <span className="text-blue-600 font-bold">{normalizarIdNatural(s.id)} ({formatearConCeros(s.id, s.rubro)})</span> | Titular: {s.asesorTitular}
                                                            </p>
                                                        </div>
                                                        <i className="fa-solid fa-chevron-right text-slate-300"></i>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {expEncontrado && (
                                    <div className="glass-card p-6 rounded-2xl border-l-4 border-[#59B447] animate-fade-in z-10">
                                        <div className="mb-4 pb-4 border-b border-slate-100 flex justify-between items-start gap-3">
                                            <div>
                                                <div className="flex items-center gap-1.5">
                                                    <p className="text-xs text-slate-400 font-bold uppercase">Expediente N°: <span className="text-slate-800 text-base">{normalizarIdNatural(expEncontrado.id)} ({formatearConCeros(expEncontrado.id, expEncontrado.rubro)})</span></p>
                                                    <BadgeRubro rubro={expEncontrado.rubro} />
                                                </div>
                                                <p className="text-xl font-bold text-slate-800 uppercase mt-1">{expEncontrado.cliente}</p>
                                                <div className="flex gap-2 mt-2 items-center flex-wrap">
                                                    <BadgeEstado estado={expEncontrado.estadoCredito} inmune={esExpedienteInmune(expEncontrado, categoriasInmunes)} />
                                                    <span className="px-2 py-1 rounded text-[10px] font-bold bg-slate-100 text-slate-600"><i className="fa-solid fa-user-tie"></i> Titular: {expEncontrado.asesorTitular}</span>
                                                    <button onClick={()=>setHistorialVisible(expEncontrado)} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold hover:bg-blue-100">
                                                        <i className="fa-solid fa-clock-rotate-left"></i> Historial
                                                    </button>

                                                        <button onClick={()=>setModalIntegrantesVisible(expEncontrado)} className="text-[10px] bg-purple-50 text-purple-700 px-2 py-1 rounded font-bold hover:bg-purple-100">

                                                        </button>
                                                    )}

                                            </div>

                                                    </button>
                                                </div>

                                    </div>

                                                            {printConfig.qrPosition === 'DERECHA' && (
                                                                <div className="flex-1 w-full flex items-center justify-between px-1.5 py-0.5 overflow-hidden gap-1.5">
                                                                    <div className="flex-1 flex flex-col items-center justify-center overflow-hidden">
                                                                        {lineasNombre.map((lin, lIdx) => (
                                                                            <span key={lIdx} className="ticket-name-text font-black text-black uppercase text-center w-full leading-[1.12]" style={{ fontSize: `${fontOptimo}px`, fontFamily: 'Arial, sans-serif' }}>
                                                                                {lin}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                    <QRCodeCanvas value={qrValue} size={printConfig.qrSize} />
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'ARRIBA' && (
                                                                <div className="flex-1 w-full flex flex-col items-center justify-center px-1 py-0.5 overflow-hidden">
                                                                    <QRCodeCanvas value={qrValue} size={Math.min(printConfig.qrSize, 64)} />
                                                                    <span className="ticket-name-text font-black text-black uppercase text-center w-full truncate mt-0.5" style={{ fontSize: `${fontOptimo}px`, fontFamily: 'Arial, sans-serif' }}>
                                                                        {t.cliente}
                                                                    </span>
                                                                </div>
                                                            )}

                                                            {printConfig.qrPosition === 'GIGANTE' && (
                                                                <div className="flex-1 w-full flex items-center justify-center p-0.5 overflow-hidden bg-white">
                                                                    <QRCodeCanvas value={qrValue} size={printConfig.qrSize} />
                                                                </div>
                                                            )}

                                                            <div className="w-full flex flex-col items-center justify-center bg-white border-t-2 border-black shrink-0" style={{ height: '11.5mm' }}>
                                                                <span className="font-black text-red-600 tracking-tighter font-sans" style={{ fontSize: `${esGrp ? Math.max(15, printConfig.fontSizeCodigo - 5) : printConfig.fontSizeCodigo}px`, lineHeight: '1' }}>
                                                                    {codRojo}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ===================================================================== */}
                        {/* 6. PANEL GERENCIAL: ACCESOS, PDF POR USUARIO, INMUNIDAD Y PARÁMETROS  */}
                        {/* ===================================================================== */}
                        {view === 'parametros' && esGerente && (
                            <div className="animate-fade-in max-w-6xl mx-auto space-y-6 no-print">
                                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-black text-[#59B447] uppercase"><i className="fa-solid fa-users-rays mr-2"></i> Script Maestro de Usuarios y Parámetros Centralizados</h2>
                                        <p className="text-xs text-slate-300 mt-1">Sincroniza los usuarios activos, filiales y cargos desde el Script Maestro. Los asesores activos se actualizan automáticamente en Préstamos.</p>
                                    </div>
                                    <button onClick={forzarSyncUsuarios} className="bg-[#59B447] text-white font-black px-5 py-3 rounded-xl shadow hover:bg-green-600 text-xs whitespace-nowrap">
                                        <i className="fa-solid fa-rotate mr-1.5"></i> Sincronizar Usuarios y Sedes Ahora
                                    </button>
                                </div>

                                <div className="glass-card p-6 rounded-2xl border-t-4 border-blue-600">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-3 gap-2">
                                        <div>
                                            <h3 className="font-black text-slate-800 text-base uppercase">
                                                <i className="fa-solid fa-user-lock text-blue-600 mr-1.5"></i>
                                                Control de Acceso al Sistema y Permiso de Exportación PDF por Usuario Activo
                                            </h3>
                                            <p className="text-xs text-slate-500 mt-0.5">
                                                Por defecto, <strong>Cajeros</strong> y <strong>Administradores</strong> tienen acceso al sistema. Aquí puedes habilitar/revocar acceso a cualquier usuario activo y autorizar quién puede exportar reportes PDF.
                                            </p>
                                        </div>
                                        <span className="text-[11px] font-bold bg-blue-50 text-blue-800 px-3 py-1 rounded-full border border-blue-200">
                                            Usuarios Activos: {usuariosSistema.length}
                                        </span>
                                    </div>

                                    <div className="overflow-x-auto border border-slate-200 rounded-xl max-h-80">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-slate-100 text-slate-600 text-[10px] uppercase font-bold sticky top-0 z-10">
                                                <tr>
                                                    <th className="p-3">Usuario / Nombre</th>
                                                    <th className="p-3">Cargo / Rol</th>
                                                    <th className="p-3">Sede</th>
                                                    <th className="p-3 text-center">Acceso al Sistema</th>
                                                    <th className="p-3 text-center">Permitir Exportar PDF / CSV</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {usuariosSistema.map(u => {
                                                    const uKey = String(u.usuario || '').toUpperCase().trim();
                                                    const rolU = clasificarRolSistema(u.cargo);
                                                    const permU = permisosUsuariosMap[uKey] || {};
                                                    const defaultAcc = (rolU === 'GERENTE' || rolU === 'ADMINISTRADOR' || rolU === 'CAJERO');
                                                    const accesoOn = rolU === 'GERENTE' ? true : (typeof permU.accesoSistema === 'boolean' ? permU.accesoSistema : defaultAcc);
                                                    const pdfOn = rolU === 'GERENTE' ? true : Boolean(permU.exportarPdf);

                                                    return (
                                                        <tr key={uKey} className="border-b hover:bg-slate-50">
                                                            <td className="p-3">
                                                                <p className="font-black text-slate-800">{uKey}</p>
                                                                <p className="text-[10px] text-slate-500">{u.nombre || u.nombreCorto || ''}</p>
                                                            </td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded text-[10px] font-black ${
                                                                    rolU === 'GERENTE' ? 'bg-purple-100 text-purple-800' :
                                                                    rolU === 'ADMINISTRADOR' ? 'bg-amber-100 text-amber-800' :
                                                                    rolU === 'CAJERO' ? 'bg-emerald-100 text-emerald-800' :
                                                                    'bg-slate-200 text-slate-700'
                                                                }`}>{u.cargo}</span>
                                                            </td>
                                                            <td className="p-3 font-bold text-slate-600">{u.sede || 'GLOBAL'}</td>
                                                            <td className="p-3 text-center">
                                                                {rolU === 'GERENTE' ? (
                                                                    <span className="text-[10px] font-black text-purple-700 bg-purple-50 px-2.5 py-1 rounded-full">SIEMPRE ACTIVO</span>
                                                                ) : (
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => actualizarPermisoUsuarioCloud(uKey, 'accesoSistema', !accesoOn)}
                                                                        className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all ${accesoOn ? 'bg-green-600 text-white shadow-sm' : 'bg-slate-200 text-slate-600'}`}
                                                                    >
                                                                        {accesoOn ? '✔ HABILITADO' : '✖ BLOQUEADO'}
                                                                    </button>
                                                                )}
                                                            </td>
                                                            <td className="p-3 text-center">
                                                                {rolU === 'GERENTE' ? (
                                                                    <span className="text-[10px] font-black text-purple-700 bg-purple-50 px-2.5 py-1 rounded-full">AUTORIZADO</span>
                                                                ) : (
                                                                    <button
                                                                        type="button"
                                                                        disabled={!accesoOn}
                                                                        onClick={() => actualizarPermisoUsuarioCloud(uKey, 'exportarPdf', !pdfOn)}
                                                                        className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all disabled:opacity-40 ${pdfOn ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-200 text-slate-600'}`}
                                                                    >
                                                                        {pdfOn ? '📄 PDF AUTORIZADO' : 'SIN PERMISO PDF'}
                                                                    </button>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {usuariosSistema.length === 0 && (
                                                    <tr><td colSpan="5" className="text-center p-6 text-slate-400">Presiona «Sincronizar Usuarios y Sedes Ahora» para listar al personal activo.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="glass-card p-6 rounded-2xl border-t-4 border-[#59B447]">
                                    <h3 className="font-bold text-slate-800 mb-1">Añadir Categoría de Expediente, Ubicación o Sede</h3>
                                    <p className="text-xs text-slate-500 mb-3">Los asesores activos se gestionan directamente desde el Script Maestro de Usuarios.</p>
                                    <form onSubmit={agregarParametroCloud} className="flex flex-col sm:flex-row gap-3">
                                        <select value={nuevoParamTipo} onChange={e => setNuevoParamTipo(e.target.value)} className="p-3 border rounded-xl bg-slate-50 font-bold text-xs text-slate-700">
                                            <option value="ESTADO_CREDITO">CATEGORÍA DE EXPEDIENTE</option>
                                            <option value="UBICACION">UBICACIÓN FÍSICA / ESTANTE</option>
                                            <option value="SEDE">NUEVA FILIAL / SEDE</option>
                                        </select>
                                        <input type="text" required value={nuevoParamValor} onChange={e => setNuevoParamValor(e.target.value)} placeholder="Escribe el nombre de la categoría o parámetro..." className="flex-1 p-3 border rounded-xl text-sm font-bold uppercase outline-none focus:ring-2 focus:ring-[#59B447]" />
                                        <button type="submit" className="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold text-xs hover:bg-slate-700">
                                            <i className="fa-solid fa-plus mr-1"></i> Guardar en Nube
                                        </button>
                                    </form>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="glass-card p-5 rounded-2xl border-t-4 border-indigo-600">
                                        <h4 className="font-bold text-slate-800 text-sm mb-1"><i className="fa-solid fa-shield-halved text-indigo-600 mr-1"></i> Categorías e Inmunidad</h4>
                                        <p className="text-[10px] text-slate-500 mb-3">Activa el escudo <strong>Inmune</strong> en las categorías que se guardan en almacén externo para contarlas automáticamente como habidas.</p>
                                        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                            {estadosDisponibles.map(est => {
                                                const esInm = categoriasInmunes.includes(est);
                                                return (
                                                    <div key={est} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700 gap-2">
                                                        <BadgeEstado estado={est} inmune={esInm} />
                                                        <div className="flex items-center gap-1.5">
                                                            <button
                                                                type="button"
                                                                onClick={() => toggleInmunidadCategoriaCloud(est)}
                                                                className={`px-2 py-1 rounded text-[10px] font-black border ${esInm ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-indigo-50'}`}
                                                                title="Alternar Inmunidad de Almacén Externo"
                                                            >
                                                                <i className="fa-solid fa-shield-halved mr-0.5"></i> {esInm ? 'Inmune ON' : 'Hacer Inmune'}
                                                            </button>
                                                            <button onClick={() => eliminarParametroCloud('ESTADO_CREDITO', est)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded">
                                                                <i className="fa-solid fa-trash-can"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-1"><i className="fa-solid fa-user-check text-[#59B447] mr-1"></i> Asesores Activos ({sedeActual})</h4>
                                        <p className="text-[10px] text-slate-500 mb-3">Sincronizados desde el Script de Usuarios. Son los únicos habilitados para recibir préstamos.</p>
                                        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                            {asesoresActivos.map(a => (
                                                <div key={a} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span>{a}</span>
                                                    <span className="text-[9px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-black">ACTIVO</span>
                                                </div>
                                            ))}
                                            {asesoresActivos.length === 0 && (
                                                <p className="text-xs text-slate-400 text-center py-6">Sin asesores activos sincronizados.</p>
                                            )}
                                        </div>
                                    </div>

                                    <div className="glass-card p-5 rounded-2xl">
                                        <h4 className="font-bold text-slate-800 text-sm mb-1"><i className="fa-solid fa-building text-purple-600 mr-1"></i> Filiales Activas</h4>
                                        <p className="text-[10px] text-slate-500 mb-3">Sedes operativas conectadas a la base de datos.</p>
                                        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                                            {sedesDisponibles.map(s => (
                                                <div key={s} className="flex justify-between items-center p-2.5 bg-white border rounded-xl text-xs font-bold text-slate-700">
                                                    <span><i className="fa-solid fa-location-dot text-slate-400 mr-1.5"></i> {s}</span>
                                                    <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">ACTIVA</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
