<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Expedientes - CREDIBAN V18 Cloud</title>
    
    <!-- Librerías Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librerías para PDF Nativo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .tab-active { border-bottom: 3px solid #59B447; color: #59B447; font-weight: bold; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .modal-bg { animation: fadeIn 0.2s ease-out forwards; }
        
        .login-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); position: relative; overflow: hidden; }
        .login-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(89,180,71,0.05) 0%, rgba(0,0,0,0) 70%); }

        /* REPARACIÓN DEL BUG DE PDF Y DISEÑO 4x6 (24 Tickets/Hoja A4) */
        @media print {
            html, body, #root, main { 
                height: auto !important; min-height: 0 !important; overflow: visible !important; 
                display: block !important; background: white !important; margin: 0 !important; padding: 0 !important;
            }
            .no-print { display: none !important; }
            .print-container { padding-left: 2px !important; padding-top: 2px !important; }
            .print-area { 
                margin: 0 auto !important; width: 210mm !important; border-left: 2px solid black !important;
                border-top: 2px solid black !important; box-shadow: none !important; page-break-after: always; box-sizing: border-box !important;
            }
            .text-red-600 { color: #dc2626 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .ticket-cell { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // URL DE TU GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbwHEPrFeiFPsB0z1SsTeO2KKfXoSVcZsjxLbQ_UjREyTEI28edgnZDLGnTB0Z7PqTRs/exec";

        function App() {
            // ==========================================
            // SISTEMA DE SEGURIDAD Y CONEXIÓN CLOUD
            // ==========================================
            const [isAuth, setIsAuth] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);
            const [sedeActual, setSedeActual] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');
            const [loadingMsg, setLoadingMsg] = React.useState('');
            
            const [isParamAuth, setIsParamAuth] = React.useState(false);
            const [paramPass, setParamPass] = React.useState('');

            // ESTADOS DE LA APLICACIÓN
            const [view, setView] = React.useState('movimientos');
            const [asesores, setAsesores] = React.useState(() => JSON.parse(localStorage.getItem('crediban_lista_asesores')) || []);
            const [expedientes, setExpedientes] = React.useState([]);
            const [ticketsQueue, setTicketsQueue] = React.useState(() => JSON.parse(localStorage.getItem('crediban_tickets_queue')) || []);

            React.useEffect(() => { localStorage.setItem('crediban_lista_asesores', JSON.stringify(asesores)); }, [asesores]);
            React.useEffect(() => { localStorage.setItem('crediban_tickets_queue', JSON.stringify(ticketsQueue)); }, [ticketsQueue]);

            const getFechaHora = () => {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                return `${d}/${m}/${y}, ${h}:${min}`;
            };

            // LOGIN CON CONEXIÓN A GOOGLE SHEETS
            const handleLogin = async (e) => {
                e.preventDefault();
                if(!sedeActual) return alert("Por favor, selecciona una sede.");
                
                setIsLoading(true);
                setLoadingMsg('Autenticando y descargando base de datos...');
                
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'getData', sede: sedeActual, password: passwordInput })
                    });
                    const data = await res.json();
                    
                    if (data.status === 'success') {
                        setExpedientes(data.data);
                        setIsAuth(true);
                    } else {
                        alert(`❌ ${data.message}`);
                        setPasswordInput('');
                    }
                } catch (err) {
                    alert('❌ Error de conexión. Verifica tu internet y que la URL sea correcta.');
                }
                setIsLoading(false);
            };

            const checkParamAuth = () => {
                if (paramPass === passwordInput) setIsParamAuth(true);
                else { alert('❌ Contraseña de administrador incorrecta (usa la clave de tu sede).'); setParamPass(''); }
            };

            // FUNCIÓN PARA GUARDAR UN EXPEDIENTE EN LA NUBE
            const syncExpedienteCloud = async (expToSave) => {
                setIsLoading(true);
                setLoadingMsg('Sincronizando en la nube...');
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'save', sede: sedeActual, password: passwordInput, data: expToSave })
                    });
                    const data = await res.json();
                    if (data.status !== 'success') {
                        alert(`❌ Error al guardar en la nube: ${data.message}`);
                    }
                } catch (err) {
                    alert('❌ Error de conexión al guardar el expediente.');
                }
                setIsLoading(false);
            };

            // FUNCIÓN PARA CARGA MASIVA EN LA NUBE
            const syncBulkCloud = async (listaNuevos) => {
                setIsLoading(true);
                setLoadingMsg('Migrando datos a la nube...');
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'bulkSave', sede: sedeActual, password: passwordInput, data: listaNuevos })
                    });
                    const data = await res.json();
                    if (data.status !== 'success') {
                        alert(`❌ Error en carga masiva: ${data.message}`);
                    }
                } catch (err) {
                    alert('❌ Error de conexión en la carga masiva.');
                }
                setIsLoading(false);
            };

            // ==========================================
            // PARÁMETROS 
            // ==========================================
            const [nuevoAsesor, setNuevoAsesor] = React.useState('');
            const agregarAsesor = (e) => {
                e.preventDefault();
                if(nuevoAsesor && !asesores.includes(nuevoAsesor.toUpperCase())) {
                    setAsesores([...asesores, nuevoAsesor.toUpperCase()]);
                    setNuevoAsesor('');
                }
            };
            const eliminarAsesor = (asesor) => { if(confirm(`¿Eliminar al asesor ${asesor}?`)) setAsesores(asesores.filter(a => a !== asesor)); };

            const borrarTodaLaBase = () => {
                alert("⚠️ Por seguridad, la eliminación masiva de la base de datos debe hacerse manualmente borrando las filas desde Google Sheets.");
            };

            // ==========================================
            // INVENTARIO Y REGISTRO (SIN DNI)
            // ==========================================
            const [formInv, setFormInv] = React.useState({ idExp: '', cliente: '', estadoCredito: 'ACTIVO', asesorTitular: '', generarTicket: true });
            const [editMode, setEditMode] = React.useState(null);
            const [historialVisible, setHistorialVisible] = React.useState(null);
            const csvInputRef = React.useRef(null);

            const formatIdExpediente = (rawNum) => {
                const soloNum = String(rawNum).replace(/\D/g, '');
                return soloNum ? "001-" + soloNum.padStart(5, '0') : '';
            };

            const registrarExpediente = async (e) => {
                e.preventDefault();
                if(!formInv.asesorTitular) return alert("Debes seleccionar un Asesor Titular.");
                if(!formInv.idExp) return alert("Ingresa el N° de Expediente.");
                
                let idFinal = formatIdExpediente(formInv.idExp);
                if(!idFinal) return alert("El N° de Expediente debe contener números.");
                
                while(expedientes.some(x => x.id === idFinal)) {
                    const correccion = prompt(`❌ EXPEDIENTE DUPLICADO.\nEl N° de Expediente ${idFinal} ya se encuentra registrado.\n\nPor favor, ingrese el N° correcto:`);
                    if (correccion === null || correccion.trim() === '') return;
                    idFinal = formatIdExpediente(correccion);
                }

                const nuevo = {
                    id: idFinal, 
                    dni: 'CONFIDENCIAL', // DNI Oculto/Fijo por privacidad
                    cliente: formInv.cliente.toUpperCase(),
                    estadoCredito: formInv.estadoCredito, 
                    asesorTitular: formInv.asesorTitular,
                    ubicacionFisica: 'CAJA (ARCHIVO)', 
                    fechaUltimoMov: getFechaHora(),
                    historial: [{ fecha: getFechaHora(), accion: 'CREACIÓN', detalle: 'Ingreso inicial a Caja' }]
                };
                
                setExpedientes([nuevo, ...expedientes]);
                if (formInv.generarTicket) setTicketsQueue([...ticketsQueue, { id: idFinal, cliente: formInv.cliente.toUpperCase() }]);
                setFormInv({ idExp: '', cliente: '', estadoCredito: 'ACTIVO', asesorTitular: '', generarTicket: formInv.generarTicket });
                
                await syncExpedienteCloud(nuevo);
                alert(`✅ Expediente ${idFinal} registrado en la nube.`);
            };

            const guardarEdicion = async (expActual, nuevoEstado, nuevoAsesor) => {
                let cambios = [];
                if(expActual.estadoCredito !== nuevoEstado) cambios.push(`Estado: ${expActual.estadoCredito} a ${nuevoEstado}`);
                if(expActual.asesorTitular !== nuevoAsesor) cambios.push(`Titularidad: De ${expActual.asesorTitular} a ${nuevoAsesor}`);
                let historialActualizado = [...expActual.historial];
                if(cambios.length > 0) historialActualizado.unshift({ fecha: getFechaHora(), accion: 'ACTUALIZACIÓN', detalle: cambios.join(' | ') });
                
                const expEditado = { ...expActual, estadoCredito: nuevoEstado, asesorTitular: nuevoAsesor, historial: historialActualizado };
                setExpedientes(expedientes.map(e => e.id === expActual.id ? expEditado : e));
                setEditMode(null);
                await syncExpedienteCloud(expEditado);
            };

            // ==========================================
            // IMPORTACIÓN Y EXPORTACIÓN CSV
            // ==========================================
            const exportarCSV = () => {
                if(expedientes.length === 0) return alert("No hay datos para exportar.");
                const now = new Date();
                const fileName = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()} - R EXPEDIENTES.csv`;

                let csv = "ID_Expediente,DNI,Cliente,Estado,Titular,Ubicacion_Fisica,Fecha_Ultimo_Movimiento,Historial_JSON\n";
                expedientes.forEach(e => { 
                    const histStr = JSON.stringify(e.historial).replace(/"/g, '""');
                    csv += `"${e.id}","${e.dni}","${e.cliente}","${e.estadoCredito}","${e.asesorTitular}","${e.ubicacionFisica}","${e.fechaUltimoMov}","${histStr}"\n`; 
                });
                const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
            };

            const parseCSVLine = (line) => {
                const result = []; let current = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i+1] === '"') { current += '"'; i++; } 
                        else { inQuotes = !inQuotes; }
                    }
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                return result.map(s => s.replace(/^"|"$/g, '').trim());
            };

            const importarCSV = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const lines = evt.target.result.split('\n');
                    let count = 0; let nuevos = [...expedientes]; let nuevosAsesores = [...asesores];
                    let listaParaLaNube = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = parseCSVLine(lines[i]);
                        
                        if (cols.length >= 5) {
                            let rawId = cols[0];
                            let baseNum = rawId.includes('-') ? rawId.split('-')[1] : rawId;
                            let idFormal = formatIdExpediente(baseNum);

                            const dni = cols[1] ? cols[1].replace(/\D/g, '') : 'CONFIDENCIAL';
                            const cliente = cols[2] ? cols[2].toUpperCase() : '';
                            const estado = cols[3] ? cols[3].toUpperCase() : 'ACTIVO';
                            const asesor = cols[4] ? cols[4].toUpperCase() : '';
                            const ubicacionFisica = cols[5] ? cols[5].toUpperCase() : 'CAJA (ARCHIVO)';
                            const fechaUltimoMov = cols[6] ? cols[6] : getFechaHora();

                            let historialRescatado = [{ fecha: getFechaHora(), accion: 'MIGRACIÓN / CARGA', detalle: 'Ingresado masivamente a Caja' }];
                            if (cols[7] && cols[7].trim() !== '') {
                                try { historialRescatado = JSON.parse(cols[7]); } catch(err) {}
                            }

                            // Ignoramos duplicidad de DNI porque ahora todo es "CONFIDENCIAL" o "0"
                            if(idFormal && !nuevos.some(x => x.id === idFormal)) {
                                const exp = {
                                    id: idFormal, dni: dni, cliente: cliente, estadoCredito: estado, asesorTitular: asesor,
                                    ubicacionFisica: ubicacionFisica, fechaUltimoMov: fechaUltimoMov, historial: historialRescatado
                                };
                                nuevos.push(exp);
                                listaParaLaNube.push(exp);
                                count++;
                                if(asesor && !nuevosAsesores.includes(asesor)) nuevosAsesores.push(asesor);
                            }
                        }
                    }
                    setExpedientes(nuevos); setAsesores(nuevosAsesores);
                    if(listaParaLaNube.length > 0) {
                        await syncBulkCloud(listaParaLaNube);
                        alert(`✅ Carga Exitosa: Se migraron ${count} expedientes a la nube.`);
                    }
                };
                reader.readAsText(file); e.target.value = '';
            };

            // ==========================================
            // BUSCADOR EN VIVO Y PRÉSTAMOS
            // ==========================================
            const [movBusqueda, setMovBusqueda] = React.useState('');
            const [sugerencias, setSugerencias] = React.useState([]);
            const [expEncontrado, setExpEncontrado] = React.useState(null);

            const handleLiveSearch = (e) => {
                const val = e.target.value.toUpperCase();
                setMovBusqueda(val);
                if (val.length < 1) { setSugerencias([]); return; }
                const termNormalized = val.replace(/^(001-)?0*/, ''); 
                
                const matches = expedientes.filter(exp => {
                    const idNorm = String(exp.id).toUpperCase().replace(/^(001-)?0*/, '');
                    return exp.cliente.includes(val) || idNorm.includes(termNormalized);
                });
                setSugerencias(matches.slice(0, 6));
            };

            const seleccionarExpediente = (exp) => { setExpEncontrado(exp); setMovBusqueda(''); setSugerencias([]); };

            const prestarExpediente = async (quienPresta) => {
                if(!quienPresta) return alert("Selecciona a quién le prestas el expediente.");
                const expActualizado = {...expEncontrado, ubicacionFisica: `CON ASESOR: ${quienPresta}`, fechaUltimoMov: getFechaHora()};
                expActualizado.historial.unshift({ fecha: getFechaHora(), accion: 'PRÉSTAMO', detalle: `Entregado físico a ${quienPresta}` });
                setExpedientes(expedientes.map(e => e.id === expActualizado.id ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                alert(`✅ Expediente prestado a ${quienPresta}`);
            };

            const devolverCaja = async () => {
                const expActualizado = {...expEncontrado, ubicacionFisica: 'CAJA (ARCHIVO)', fechaUltimoMov: getFechaHora()};
                expActualizado.historial.unshift({ fecha: getFechaHora(), accion: 'DEVOLUCIÓN', detalle: 'Retornado físicamente a Caja' });
                setExpedientes(expedientes.map(e => e.id === expActualizado.id ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                alert("✅ Expediente devuelto a Caja Central.");
            };

            // ==========================================
            // REIMPRESIÓN MANUAL DE TICKETS
            // ==========================================
            const [manualId, setManualId] = React.useState('');
            const [manualCliente, setManualCliente] = React.useState('');

            const agregarTicketManual = (e) => {
                e.preventDefault();
                if (!manualId || !manualCliente) return;
                const idFormal = formatIdExpediente(manualId);
                if (!idFormal) return alert("El N° de Expediente debe contener números.");
                setTicketsQueue([...ticketsQueue, { id: idFormal, cliente: manualCliente.toUpperCase() }]);
                setManualId(''); setManualCliente('');
            };

            const parseTicketName = (fullName) => {
                const words = fullName.trim().split(/\s+/);
                if (words.length <= 2) return { part1: fullName, part2: '' };
                return { part1: `${words[0]} ${words[1]}`, part2: words.slice(2).join(' ') };
            };

            const getTicketNameStyle = (name) => {
                const len = name.length;
                if (len >= 35) return 'text-[12px] leading-[1.1]';
                if (len >= 20) return 'text-[14px] leading-[1.1]';
                return 'text-[17px] leading-[1.1]'; 
            };

            const processTicketsForPrint = () => {
                const paddedQueue = [...ticketsQueue];
                const rem = paddedQueue.length % 24;
                if (rem > 0 || paddedQueue.length === 0) {
                    const toAdd = paddedQueue.length === 0 ? 24 : 24 - rem;
                    for(let i=0; i < toAdd; i++) paddedQueue.push({ isEmpty: true });
                }
                const pages = [];
                for (let i = 0; i < paddedQueue.length; i += 24) pages.push(paddedQueue.slice(i, i + 24));
                return pages;
            };
            const printPages = processTicketsForPrint();

            // ==========================================
            // DASHBOARD Y FILTROS
            // ==========================================
            const [dashFilterAsesor, setDashFilterAsesor] = React.useState('TODOS');
            const [dashFiltroUbicacion, setDashFiltroUbicacion] = React.useState('TODOS');
            const [modalReporte, setModalReporte] = React.useState(false);

            let listaDash = expedientes;
            if (dashFilterAsesor !== 'TODOS') listaDash = listaDash.filter(e => e.asesorTitular === dashFilterAsesor);
            if (dashFiltroUbicacion === 'CAJA') listaDash = listaDash.filter(e => e.ubicacionFisica.includes('CAJA'));
            if (dashFiltroUbicacion === 'CAMPO') listaDash = listaDash.filter(e => !e.ubicacionFisica.includes('CAJA'));

            const generarReportePDF = (tipoReporte) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFont("georgia", "bold"); doc.setTextColor(89, 180, 71); doc.setFontSize(22);
                doc.text("CREDIBAN", 14, 20);
                doc.setFont("helvetica", "normal"); doc.setTextColor(100, 100, 100); doc.setFontSize(9);
                doc.text(`Reporte Oficial de Expedientes Físicos - Generado: ${getFechaHora()}`, 14, 26);
                
                doc.setTextColor(40, 40, 40); doc.setFontSize(12); doc.setFont("helvetica", "bold");
                let titulo = `Filtros: Asesor: ${dashFilterAsesor} | Ubicación: ${dashFiltroUbicacion}`;
                doc.text(titulo, 14, 34);

                if (tipoReporte === 'DETALLADO') {
                    const tableData = listaDash.map(e => [e.id, e.cliente, e.estadoCredito, e.asesorTitular, e.ubicacionFisica, e.fechaUltimoMov]);
                    doc.autoTable({
                        startY: 40, head: [['N° EXP', 'CLIENTE', 'ESTADO', 'TITULAR', 'UBICACIÓN FÍSICA', 'FECHA MOV.']],
                        body: tableData, theme: 'grid', styles: { fontSize: 8 }, headStyles: { fillColor: [89, 180, 71] }
                    });
                } else { 
                    doc.autoTable({
                        startY: 40, head: [['MÉTRICA ESTADÍSTICA', 'CANTIDAD EXACTA']],
                        body: [
                            ['Total de Expedientes en esta selección', listaDash.length],
                            ['Resguardados físicamente en Caja', listaDash.filter(e => e.ubicacionFisica.includes('CAJA')).length],
                            ['Prestados / En Campo (Fuera de Caja)', listaDash.filter(e => !e.ubicacionFisica.includes('CAJA')).length],
                            ['Estado Crediticio: ACTIVO', listaDash.filter(e => e.estadoCredito === 'ACTIVO').length]
                        ], theme: 'grid', styles: { fontSize: 10 }, headStyles: { fillColor: [89, 180, 71] }
                    });
                }
                doc.save(`Reporte_Crediban_${tipoReporte}_${Date.now()}.pdf`);
                setModalReporte(false);
            };

            // UI COMPONENTES REUTILIZABLES
            const BadgeEstado = ({estado}) => {
                const colors = { 'ACTIVO': 'bg-green-100 text-green-700', 'MORA DURA': 'bg-red-100 text-red-700 font-bold', 'CANCELADO': 'bg-blue-100 text-blue-700', 'LISTA NEGRA': 'bg-slate-800 text-white font-bold' };
                return <span className={`px-2 py-1 rounded text-[10px] font-bold ${colors[estado] || 'bg-gray-100'}`}>{estado}</span>;
            };

            const ModalHistorial = ({ exp, onClose }) => (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 modal-bg no-print">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[85vh]">
                        <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <div><h3 className="font-bold text-slate-800">Historial Inalterable</h3><p className="text-xs text-slate-500">{exp.cliente} | ID: {exp.id}</p></div>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-500 p-2"><i className="fa-solid fa-xmark fa-xl"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 space-y-4">
                            {exp.historial.map((h, i) => (
                                <div key={i} className="border-l-2 border-[#59B447] pl-4 relative">
                                    <div className="absolute w-2 h-2 bg-[#59B447] rounded-full -left-[5px] top-1"></div>

                                <div className="xl:col-span-3 glass-card p-6 rounded-2xl h-[800px] flex flex-col">
                                    <div className="flex justify-between items-center mb-4 border-b pb-2"><h3 className="font-bold text-slate-800">Base Sincronizada ({expedientes.length})</h3></div>
                                    <div className="overflow-x-auto overflow-y-auto flex-1 border border-slate-200 rounded-xl">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-100 text-slate-600 text-[10px] uppercase font-bold sticky top-0 z-10 shadow-sm">
                                                <tr><th className="p-3">Datos / N° Exp</th><th className="p-3">Estado / Titular</th><th className="p-3">Físico</th><th className="p-3">Acciones</th></tr>
                                            </thead>
                                            <tbody>
                                                {expedientes.map(e => {
                                                    const isEditing = editMode && editMode.id === e.id;
                                                    return (
                                                    <tr key={e.id} className="border-b hover:bg-slate-50">
                                                        <td className="p-3"><p className="font-bold text-slate-700 text-xs">{e.cliente}</p><p className="text-[10px] text-slate-500 font-bold mt-1">Exp: <span className="text-blue-600">{e.id}</span> | DNI: {e.dni}</p></td>
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <div className="space-y-1">
                                                                    <select value={editMode.nuevoEstado} onChange={(evt)=> setEditMode({...editMode, nuevoEstado: evt.target.value})} className="text-[10px] border p-1 rounded w-full font-bold">
                                                                        <option value="ACTIVO">ACTIVO</option><option value="MORA DURA">MORA DURA</option><option value="CANCELADO">CANCELADO</option><option value="LISTA NEGRA">LISTA NEGRA</option>
                                                                    </select>
                                                                    <select value={editMode.nuevoAsesor} onChange={(evt)=> setEditMode({...editMode, nuevoAsesor: evt.target.value})} className="text-[10px] border p-1 rounded w-full">
                                                                        {asesores.map(a => <option key={a} value={a}>{a}</option>)}
                                                                    </select>
                                                                </div>
                                                            ) : ( <><BadgeEstado estado={e.estadoCredito} /><p className="text-[10px] font-semibold mt-1">Asesor: {e.asesorTitular}</p></> )}
                                                        </td>
                                                        <td className="p-3"><p className={`text-[10px] font-bold ${e.ubicacionFisica.includes('CAJA') ? 'text-green-600' : 'text-red-500'}`}>{e.ubicacionFisica}</p><p className="text-[9px] text-slate-400 mt-1">{e.fechaUltimoMov}</p></td>
                                                        <td className="p-3">
                                                            {isEditing ? (
                                                                <div className="flex gap-1 flex-col sm:flex-row"><button onClick={()=>guardarEdicion(e, editMode.nuevoEstado, editMode.nuevoAsesor)} className="bg-[#59B447] text-white px-2 py-1 rounded text-[10px] font-bold">Guardar</button><button onClick={()=>setEditMode(null)} className="bg-slate-300 text-slate-700 px-2 py-1 rounded text-[10px] font-bold">Cancelar</button></div>
                                                            ) : (
                                                                <div className="flex gap-1 flex-col"><button onClick={()=>setEditMode({ id: e.id, nuevoEstado: e.estadoCredito, nuevoAsesor: e.asesorTitular })} className="bg-slate-100 text-slate-700 border border-slate-300 px-2 py-1 rounded text-[10px] font-bold hover:bg-slate-200"><i className="fa-solid fa-pen"></i> Editar</button><button onClick={()=>setHistorialVisible(e)} className="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded text-[10px] font-bold hover:bg-blue-100"><i className="fa-solid fa-clock-rotate-left"></i> Historial</button></div>
                                                            )}
                                                        </td>
                                                    </tr>
                                                )})}
                                                {expedientes.length === 0 && <tr><td colSpan="4" className="text-center p-8 text-slate-400">Sin datos.</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA 4: TICKETS FÍSICOS */}
                        {view === 'tickets' && (
                            <div className="animate-fade-in">
                                <div className="no-print bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                                    <h3 className="font-bold text-slate-800 mb-3"><i className="fa-solid fa-keyboard text-blue-500"></i> Generar Ticket Manual (Reimpresión)</h3>
                                    <form onSubmit={agregarTicketManual} className="flex flex-col md:flex-row gap-3">
                                        <div className="flex-1"><input type="text" placeholder="N° Expediente (Ej. 124)" value={manualId} onChange={e=>setManualId(e.target.value.replace(/\D/g, ''))} className="w-full p-2.5 border rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-[#59B447]" required /></div>
                                        <div className="flex-1"><input type="text" placeholder="Nombre Completo del Cliente" value={manualCliente} onChange={e=>setManualCliente(e.target.value.toUpperCase())} className="w-full p-2.5 border rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-[#59B447]" required /></div>
                                        <button type="submit" className="bg-[#59B447] text-white px-5 py-2.5 rounded-lg font-bold shadow hover:bg-green-600 transition-colors whitespace-nowrap"><i className="fa-solid fa-plus"></i> Añadir a Cola</button>
                                    </form>
                                </div>
                                <div className="no-print mb-4 flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
                                    <div><h2 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-print text-[#59B447]"></i> Vista Previa (A4 - 4x6)</h2><p className="text-sm text-slate-500">Etiquetas en cola: <span className="font-bold text-blue-600">{ticketsQueue.length}</span></p></div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={() => { if(confirm("¿Vaciar todas las etiquetas en cola?")) setTicketsQueue([]); }} className="bg-red-50 text-red-600 px-4 py-2.5 rounded-lg font-bold hover:bg-red-100 flex-1 sm:flex-none text-sm">Vaciar Todo</button>
                                        <button onClick={() => window.print()} className="bg-slate-800 text-white px-6 py-2.5 rounded-lg font-bold shadow-md hover:bg-slate-700 flex-1 sm:flex-none text-sm">Imprimir A4 Ahora</button>
                                    </div>
                                </div>
                                <div className="print-container w-full flex flex-col items-center">
                                    {printPages.map((page, pageIdx) => (
                                        <div key={pageIdx} className="print-area bg-white mx-auto w-full mb-8" style={{ pageBreakAfter: pageIdx === printPages.length - 1 ? 'auto' : 'always' }}>
                                            <div className="grid grid-cols-4 w-full border-t-2 border-l-2 border-black">
                                                {page.map((t, idx) => {
                                                    if (t.isEmpty) return ( <div key={`empty-${idx}`} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border" style={{ height: '40mm' }}><div className="w-full bg-white border-b-2 border-black shrink-0" style={{ height: '4.5mm' }}></div><div className="flex-1 w-full bg-transparent"></div><div className="w-full bg-slate-50/30 border-t-2 border-black shrink-0" style={{ height: '14.5mm' }}></div></div> );
                                                    const nombres = parseTicketName(t.cliente);
                                                    return (
                                                    <div key={idx} className="ticket-cell flex flex-col border-r-2 border-b-2 border-black bg-white box-border overflow-hidden justify-between" style={{ height: '40mm' }}>
                                                        <div className="w-full bg-white border-b-2 border-black shrink-0" style={{ height: '4.5mm' }}></div>
                                                        <div className="flex-1 w-full flex flex-col items-center justify-center p-1 overflow-hidden">
                                                            <span className={`font-black text-black uppercase text-center w-full leading-[1.1] break-words whitespace-normal ${getTicketNameStyle(t.cliente)}`} style={{ fontFamily: 'Arial, sans-serif' }}>{nombres.part1}</span>
                                                            {nombres.part2 && ( <span className={`font-extrabold text-black uppercase text-center w-full leading-[1.1] break-words whitespace-normal ${getTicketNameStyle(t.cliente)}`} style={{ fontFamily: 'Arial, sans-serif' }}>{nombres.part2}</span> )}
                                                        </div>
                                                        <div className="w-full flex items-center justify-center bg-white border-t-2 border-black pb-1 shrink-0" style={{ height: '14.5mm' }}>
                                                            <span className="font-black text-[28px] text-red-600 tracking-tighter font-sans" style={{ lineHeight: '1', textShadow: '0px 0px 0px #dc2626' }}>{t.id}</span>
                                                        </div>
                                                    </div>
                                                )})}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VISTA 5: PARÁMETROS */}
                        {view === 'parametros' && (
                            <div className="animate-fade-in max-w-4xl mx-auto no-print">
                                {!isParamAuth ? (
                                    <div className="glass-card p-10 rounded-2xl max-w-md mx-auto text-center shadow-xl border-t-4 border-[#59B447] mt-10">
                                        <i className="fa-solid fa-shield-halved text-5xl text-slate-300 mb-4"></i>
                                        <h2 className="text-xl font-bold text-slate-800 mb-2">Zona Protegida</h2>
                                        <p className="text-xs text-slate-500 mb-6">Ingresa la clave maestra para administrar asesores en {sedeActual}.</p>
                                        <input type="password" value={paramPass} onChange={e=>setParamPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && checkParamAuth()} placeholder="Contraseña..." className="w-full p-3 border border-slate-300 rounded-xl mb-4 text-center font-bold tracking-widest outline-none focus:ring-2 focus:ring-[#59B447]" />
                                        <button onClick={checkParamAuth} className="bg-[#59B447] text-white font-bold py-3 px-6 rounded-xl w-full shadow-md hover:bg-green-600 transition-colors">Desbloquear Parámetros</button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="glass-card p-6 rounded-2xl">
                                            <h2 className="text-xl font-bold text-slate-800 mb-2">Asesores de la Agencia</h2>
                                            <form onSubmit={agregarAsesor} className="flex gap-2 mb-6">
                                                <input type="text" value={nuevoAsesor} onChange={e=>setNuevoAsesor(e.target.value)} placeholder="Ej. MELISSA C." className="flex-1 p-2 border rounded bg-white text-sm uppercase outline-none focus:ring-2 focus:ring-[#59B447]" required />
                                                <button type="submit" className="bg-[#59B447] text-white px-4 rounded font-bold text-sm">Añadir</button>
                                            </form>
                                            <div className="space-y-2 max-h-80 overflow-y-auto pr-2">
                                                {asesores.map(a => (
                                                    <div key={a} className="flex justify-between items-center p-3 bg-white border rounded-lg shadow-sm">
                                                        <span className="font-bold text-slate-700 text-sm"><i className="fa-solid fa-user-tie text-slate-400 mr-2"></i> {a}</span>
                                                        <button onClick={()=>eliminarAsesor(a)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded"><i className="fa-solid fa-trash-can"></i></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
