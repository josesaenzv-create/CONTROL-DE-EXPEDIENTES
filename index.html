                    }
                    return { status: 'error' };
                }
            };

            const modoAuditoriaInmunesRef = React.useRef(modoAuditoriaInmunes);
            React.useEffect(() => { modoAuditoriaInmunesRef.current = modoAuditoriaInmunes; }, [modoAuditoriaInmunes]);

            // =====================================================================
            // PROCESADOR QR UNIVERSAL (MOTOR DE LECTURA INTACTO + RUBROS + INMUNIDAD)
            // =====================================================================
            const procesarLecturaQR = React.useCallback(async (rawText) => {
                if (!rawText) return;
                const clean = String(rawText).trim().toUpperCase();

                const nowMs = Date.now();
                if (lastScannedRef.current.code === clean && (nowMs - lastScannedRef.current.time) < 1300) {
                    return;
                }
                lastScannedRef.current = { code: clean, time: nowMs };

                const modoActual = scanModeRef.current;
                const esAuditoriaInmunes = modoAuditoriaInmunesRef.current;

                if (modoActual === 'INVENTARIO' && !esAuditoriaInmunes && cierreInfoRef.current?.cerrado) {
                    playSound('alert');
                    setScanFeedback({
                        type: 'error',
                        title: `🔒 INVENTARIO DEL DÍA YA CERRADO (${cierreInfoRef.current.cajero})`,
                        subtitle: 'Toca "Iniciar Nueva Sesión de Inventario" si deseas empezar un nuevo conteo.'
                    });
                    return;
                }

                let idNaturalDetectado = '';
                let clienteQR = '';
                let rubroDetectado = null;

                if (clean.includes('GRP-') || clean.includes('GRUPAL')) {
                    rubroDetectado = 'GRUPAL';
                }

                if (clean.includes('|')) {
                    const partes = clean.split('|').map(p => p.trim());
                    if (partes.includes('GRUPAL')) rubroDetectado = 'GRUPAL';
                    if (partes.includes('INDIVIDUAL')) rubroDetectado = 'INDIVIDUAL';
                    const parteCodigo = partes.find(p => /\d+/.test(p)) || partes[1] || partes[0];
                    idNaturalDetectado = normalizarIdNatural(parteCodigo);
                    if (partes.length >= 3) clienteQR = partes[partes.length - 1];
                } else {
                    idNaturalDetectado = normalizarIdNatural(clean);
                }

                if (!idNaturalDetectado || !/\d+/.test(idNaturalDetectado)) {
                    playSound('alert');
                    const msgErr = { hora: getFechaHora(), titulo: 'QR INVÁLIDO', detalle: clean };
                    setAlertasEscaneo(prev => [msgErr, ...prev.slice(0, 9)]);
                    setScanFeedback({ type: 'error', title: '🚨 CÓDIGO QR NO RECONOCIDO', subtitle: `Lectura: ${clean}` });
                    return;
                }

                let exp = null;
                if (rubroDetectado) {
                    exp = expedientesRef.current.find(x => normalizarRubro(x.rubro) === rubroDetectado && normalizarIdNatural(x.id) === idNaturalDetectado);
                } else {
                    const coincidencias = expedientesRef.current.filter(x => normalizarIdNatural(x.id) === idNaturalDetectado);
                    if (coincidencias.length === 1) {
                        exp = coincidencias[0];
                    } else if (coincidencias.length > 1) {
                        exp = coincidencias.find(x => normalizarRubro(x.rubro) === 'INDIVIDUAL') || coincidencias[0];
                    }
                }

                if (!exp) {
                    playSound('alert');
                    const rubroTxt = rubroDetectado === 'GRUPAL' ? 'GRUPAL ' : '';
                    const codigoMostrar = `${rubroTxt}${idNaturalDetectado} (${formatearConCeros(idNaturalDetectado, rubroDetectado || 'INDIVIDUAL')})`;
                    const msgErr = {
                        hora: getFechaHora(),
                        titulo: `NO EXISTE EXP. ${codigoMostrar}`,
                        detalle: clienteQR || 'No registrado en la base de esta sede'
                    };
                    setAlertasEscaneo(prev => [msgErr, ...prev.slice(0, 9)]);
                    setScanFeedback({
                        type: 'error',
                        title: `🚨 EXPEDIENTE ${codigoMostrar} NO EXISTE EN ${sedeRef.current}`,
                        subtitle: clienteQR ? `Etiqueta: ${clienteQR} — Regístralo en Base de Datos` : 'Regístralo primero en Base de Datos'
                    });
                    return;
                }

                const asesorSeleccionado = asesorLoteRef.current;
                const cajeroNombre = operadorRef.current;
                const estadoPrevio = JSON.parse(JSON.stringify(exp));
                const claveExp = obtenerClaveUnicaExp(exp);
                const rubroExp = normalizarRubro(exp.rubro);
                const etiquetaRubro = rubroExp === 'GRUPAL' ? ' [GRUPAL]' : '';
                const tieneInmunidad = esExpedienteInmune(exp, categoriasInmunesRef.current);

                // MODO 1A: AUDITORÍA PERIÓDICA DE EXPEDIENTES CON INMUNIDAD (ALMACÉN EXTERNO)
                if (modoActual === 'INVENTARIO' && esAuditoriaInmunes) {
                    if (!tieneInmunidad) {
                        playSound('alert');
                        setScanFeedback({
                            type: 'error',
                            title: `⚠️ NO PERTENECE A ALMACÉN INMUNE: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                            subtitle: `${exp.cliente} — Categoría "${exp.estadoCredito}" corresponde al almacén principal.`
                        });
                        return;
                    }
                    if (exp.invInmuneFecha && String(exp.invInmuneFecha).trim() !== '') {
                        playSound('duplicate');
                        setScanFeedback({
                            type: 'warning',
                            title: `⚠️ YA AUDITADO EN INMUNES: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                            subtitle: `${exp.cliente} — Verificado por ${exp.invInmuneCajero} (${exp.invInmuneFecha})`
                        });
                        return;
                    }

                    playSound('beep');
                    const horaActual = getFechaHora();
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'AUDITORÍA INMUNES QR',
                        detalle: `Verificado en Almacén Externo (Inmune) por ${cajeroNombre}`
                    });

                    const actualizado = {
                        ...exp,
                        invInmuneFecha: horaActual,
                        invInmuneCajero: cajeroNombre,
                        fechaUltimoMov: horaActual,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? actualizado : item));
                    setScanLog(prev => [{ clave: claveExp, id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: 'success',
                        title: `🛡️ INMUNE AUDITADO: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                        subtitle: `${exp.cliente} | Categoría: ${exp.estadoCredito} | Almacén Externo Conforme`
                    });
                    syncExpedienteCloud(actualizado, true, false);
                    return;
                }

                // MODO 1B: INVENTARIO EN VIVO (EVITA DUPLICADOS ENTRE CAJEROS Y RECONOCE INMUNIDAD)
                if (modoActual === 'INVENTARIO') {
                    if (estaContabilizadoFisicoEnSesion(exp)) {
                        playSound('duplicate');
                        setAlertasEscaneo(prev => [{
                            hora: getFechaHora(),
                            titulo: `DUPLICADO: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                            detalle: `${exp.cliente} (Ya pasado por ${exp.invCajero})`
                        }, ...prev.slice(0, 9)]);
                        setScanFeedback({
                            type: 'warning',
                            title: `⚠️ YA CONTABILIZADO: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro} (${formatearConCeros(exp.id, rubroExp)})`,
                            subtitle: `${exp.cliente} — Escaneado por ${exp.invCajero || 'CAJERO'} (${exp.invFecha})`
                        });
                        return;
                    }

                    const esRestringido = exp.estadoCredito === 'LISTA NEGRA' || exp.estadoCredito === 'MORA DURA';
                    playSound(esRestringido ? 'alert' : 'beep');

                    const horaActual = getFechaHora();
                    const estabaFuera = !exp.ubicacionFisica.includes('CAJA') && !tieneInmunidad;
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'INVENTARIO QR',
                        detalle: `Verificado físicamente por ${cajeroNombre}${tieneInmunidad ? ' (Categoría con Inmunidad / Almacén Externo)' : estabaFuera ? ' (Retornado automáticamente a Caja)' : ''}`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: tieneInmunidad ? exp.ubicacionFisica : 'CAJA (ARCHIVO)',
                        fechaUltimoMov: horaActual,
                        invFecha: horaActual,
                        invCajero: cajeroNombre,
                        invSesion: 'SES_ACTIVA',
                        historial: nuevoHist
                    };

                    recentLocalScansRef.current[claveExp] = {
                        timestamp: Date.now(),
                        data: actualizado
                    };

                    setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? actualizado : item));
                    setScanLog(prev => [{ clave: claveExp, id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: esRestringido ? 'danger_ok' : 'success',
                        title: `✅ INVENTARIO REGISTRADO: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro} (${formatearConCeros(exp.id, rubroExp)})`,
                        subtitle: `${exp.cliente} | Estado: ${exp.estadoCredito}${tieneInmunidad ? ' | 🛡️ CON INMUNIDAD (Almacén Externo)' : estabaFuera ? ' | 🔄 Devuelto a CAJA' : ''}`
                    });

                    const resp = await syncExpedienteCloud(actualizado, true, true);
                    if (resp && resp.status === 'duplicate_inv') {
                        playSound('duplicate');
                        const actualizadoOtro = { ...actualizado, invFecha: resp.invFecha, invCajero: resp.invCajero };
                        recentLocalScansRef.current[claveExp] = { timestamp: Date.now(), data: actualizadoOtro };
                        setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? actualizadoOtro : item));
                        setScanFeedback({
                            type: 'warning',
                            title: `⚠️ YA CONTABILIZADO EN OTRO CELULAR: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                            subtitle: `Registrado por ${resp.invCajero} (${resp.invFecha})`
                        });
                    } else if (resp && resp.status === 'inventory_closed') {
                        playSound('alert');
                        delete recentLocalScansRef.current[claveExp];
                        setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? estadoPrevio : item));
                        setScanFeedback({
                            type: 'error',
                            title: '🔒 INVENTARIO CERRADO',
                            subtitle: resp.message
                        });
                    }
                    return;
                }

                // MODO 2: RETORNO A CAJA
                if (modoActual === 'RETORNO') {
                    playSound('beep');
                    const horaActual = getFechaHora();
                    const ubicacionPrevia = exp.ubicacionFisica;
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'DEVOLUCIÓN QR',
                        detalle: `Retornado físicamente a Caja por ${cajeroNombre} (Antes: ${ubicacionPrevia})`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: 'CAJA (ARCHIVO)',
                        fechaUltimoMov: horaActual,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? actualizado : item));
                    setScanLog(prev => [{ clave: claveExp, id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: 'success',
                        title: `📥 DEVUELTO A CAJA: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                        subtitle: `${exp.cliente} (Retornado de: ${ubicacionPrevia})`
                    });
                    syncExpedienteCloud(actualizado, true);
                    return;
                }

                // MODO 3: SALIDA / PRÉSTAMO POR LOTE
                if (modoActual === 'PRESTAMO') {
                    if (!asesorSeleccionado) {
                        playSound('alert');
                        setScanFeedback({
                            type: 'error',
                            title: 'SELECCIONA UN ASESOR ACTIVO PRIMERO',
                            subtitle: 'Elige al asesor en la lista naranja antes de escanear las carpetas'
                        });
                        return;
                    }

                    const esRestringido = exp.estadoCredito === 'LISTA NEGRA' || exp.estadoCredito === 'MORA DURA';
                    playSound(esRestringido ? 'alert' : 'beep');

                    const horaActual = getFechaHora();
                    const prestamoCruzado = !exp.ubicacionFisica.includes('CAJA') && exp.ubicacionFisica !== `CON ASESOR: ${asesorSeleccionado}`;
                    const nuevoHist = [...(exp.historial || [])];
                    nuevoHist.unshift({
                        fecha: horaActual,
                        accion: 'PRÉSTAMO QR',
                        detalle: `Entregado a ${asesorSeleccionado} por ${cajeroNombre}${prestamoCruzado ? ` (Transferido desde ${exp.ubicacionFisica})` : ''}`
                    });

                    const actualizado = {
                        ...exp,
                        ubicacionFisica: `CON ASESOR: ${asesorSeleccionado}`,
                        fechaUltimoMov: horaActual,
                        historial: nuevoHist
                    };

                    setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === claveExp ? actualizado : item));
                    setScanLog(prev => [{ clave: claveExp, id: exp.id, cliente: exp.cliente, prev: estadoPrevio }, ...prev.slice(0, 29)]);
                    setScanFeedback({
                        type: esRestringido ? 'danger_ok' : (prestamoCruzado ? 'warning' : 'success'),
                        title: `📤 ENTREGADO A ${asesorSeleccionado}: EXP. ${normalizarIdNatural(exp.id)}${etiquetaRubro}`,
                        subtitle: `${exp.cliente} | Estado: ${exp.estadoCredito}${prestamoCruzado ? ` | ⚠️ Figuraba ${exp.ubicacionFisica}` : ''}`
                    });
                    syncExpedienteCloud(actualizado, true);
                }
            }, []);

            // CÁMARA CONTINUA HTML5-QRCODE (100% INTACTA)
            React.useEffect(() => {
                if (view !== 'escaner' && cameraActive) setCameraActive(false);
            }, [view]);

            React.useEffect(() => {
                let isMounted = true;
                const iniciarEscaner = async () => {
                    if (!cameraActive || view !== 'escaner' || !puedeOperarCaja) return;
                    try {
                        if (html5QrInstanceRef.current && html5QrInstanceRef.current.isScanning) {
                            await html5QrInstanceRef.current.stop();
                            html5QrInstanceRef.current.clear();
                        }
                        if (camerasList.length === 0 && window.Html5Qrcode.getCameras) {
                            try {
                                const devices = await window.Html5Qrcode.getCameras();
                                if (isMounted && devices && devices.length > 0) setCamerasList(devices);
                            } catch (e) {}
                        }

                        const qrReader = new window.Html5Qrcode("qr-reader-box", {
                            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
                            verbose: false
                        });
                        html5QrInstanceRef.current = qrReader;

                        const camConfig = selectedCamId ? { deviceId: { exact: selectedCamId } } : { facingMode: "environment" };
                        await qrReader.start(
                            camConfig,
                            {
                                fps: 25,
                                qrbox: (vw, vh) => {
                                    const side = Math.max(175, Math.floor(Math.min(vw, vh) * 0.80));
                                    return { width: side, height: side };
                                },
                                aspectRatio: 1.0
                            },
                            (decodedText) => procesarLecturaQR(decodedText),
                            () => {}
                        );
                    } catch (err) {
                        if (isMounted) {
                            alert("No se pudo iniciar la cámara. Acepta los permisos de cámara del navegador.");
                            setCameraActive(false);
                        }
                    }
                };
                iniciarEscaner();
                return () => {
                    isMounted = false;
                    setTorchOn(false);
                    if (html5QrInstanceRef.current && html5QrInstanceRef.current.isScanning) {
                        html5QrInstanceRef.current.stop().then(() => html5QrInstanceRef.current.clear()).catch(() => {});
                    }
                };
            }, [cameraActive, view, selectedCamId]);

            const toggleLinterna = async () => {
                if (!html5QrInstanceRef.current || !html5QrInstanceRef.current.isScanning) return;
                try {
                    const nextState = !torchOn;
                    await html5QrInstanceRef.current.applyVideoConstraints({ advanced: [{ torch: nextState }] });
                    setTorchOn(nextState);
                } catch (e) {
                    alert("Este lente no soporta encendido de flash desde el navegador.");
                }
            };

            const deshacerUltimoEscaneo = async () => {
                if (scanLog.length === 0) return;
                const ultimo = scanLog[0];
                const restaurado = ultimo.prev;
                const clave = obtenerClaveUnicaExp(restaurado);
                delete recentLocalScansRef.current[clave];
                setExpedientes(prev => prev.map(item => obtenerClaveUnicaExp(item) === clave ? restaurado : item));
                setScanLog(prev => prev.slice(1));
                setScanFeedback({
                    type: 'warning',
                    title: `↩️ ESCANEO DESHECHO: EXP. ${normalizarIdNatural(restaurado.id)}`,
                    subtitle: `Se restauró el estado anterior de ${restaurado.cliente}`
                });
                await syncExpedienteCloud(restaurado, true);
            };

            // =====================================================================
            // BLOQUES DE ESTANTE DIGITABLES Y FIJABLES POR SEDE (EJ. 27 O 40)
            // =====================================================================
            const aplicarTamanoBloquePersonalizado = (valorRaw) => {
                const num = parseInt(String(valorRaw || '').replace(/\D/g, ''), 10);
                if (!isNaN(num) && num >= 1 && num <= 1000) {
                    setBloqueTamano(num);
                    setBloqueTamanoInput(String(num));
                }
            };

            const fijarBloqueEnSede = async () => {
                const num = parseInt(String(bloqueTamanoInput || '').replace(/\D/g, ''), 10);
                if (isNaN(num) || num < 1 || num > 1000) {
                    return alert("Digita un tamaño de bloque válido entre 1 y 1000 (ej. 27 o 40).");
                }
                setBloqueTamano(num);
                setBloqueTamanoInput(String(num));
                localStorage.setItem(`crediban_v23_bloque_${sedeActual}`, String(num));
                setBloqueFijadoInfo(`Fijado en ${sedeActual}: ${num} en ${num}`);
                playSound('beep');

                try {
                    await fetchGAS({
                        action: 'guardarBloqueSede',
                        sede: sedeActual,
                        tamanoBloque: num,
                        usuario: operadorNombre
                    });
                } catch (e) {}
            };

            // =====================================================================
            // CIERRE OFICIAL DE INVENTARIO DEL DÍA CON CONTRASEÑA Y APERTURA NUEVA
            // =====================================================================
            const ejecutarCierreInventarioDia = async (e) => {
                e.preventDefault();
                if (!passCierreInput.trim()) return alert("Digita tu contraseña personal para firmar el cierre de inventario.");
                setIsLoading(true);
                setLoadingMsg(`Verificando contraseña de ${operadorNombre} y cerrando inventario en ${sedeActual}...`);
                try {
                    const data = await fetchGAS({
                        action: 'cerrarInventarioDia',
                        sede: sedeActual,
                        usuario: operadorNombre,
                        password: passCierreInput.trim(),
                        observacion: obsCierreInput,
                        resumenHabidos: totalHabidosInventario,
                        resumenInmunes: totalInmunesConsiderados
                    });
                    if (data.status === 'success') {
                        setCierreInfo(data.cierreInfo);
                        setModalCierreInv(false);
                        setPassCierreInput('');
                        setCameraActive(false);
                        playSound('beep');
                        alert(`🔒 INVENTARIO CERRADO OFICIALMENTE EN ${sedeActual}\n\nFirmado por: ${operadorNombre}\nEscaneados Físicos: ${totalFisicosEscaneados}\nInmunes (Almacén Externo): ${totalInmunesConsiderados}\nTotal Habidos: ${totalHabidosInventario} de ${expedientes.length}`);
                    } else {
                        playSound('alert');
                        alert(data.message || 'No se pudo cerrar el inventario.');
                    }
                } catch (err) {
                    alert('❌ Error de conexión al cerrar el inventario.');
                }
                setIsLoading(false);
            };

            const iniciarNuevaSesionInventario = async (soloLimpiarInmunes = false) => {
                const msgConfirm = soloLimpiarInmunes
                    ? `¿Iniciar una NUEVA AUDITORÍA PERIÓDICA de expedientes con INMUNIDAD (Almacén Externo) en ${sedeActual}?`
                    : `¿Iniciar una NUEVA SESIÓN de inventario en ${sedeActual}?\n\nEsto limpiará las marcas del conteo físico anterior (los expedientes con Inmunidad seguirán considerándose Habidos en el almacén externo).`;
                if (!confirm(msgConfirm)) return;

                setIsLoading(true);
                setLoadingMsg(soloLimpiarInmunes ? 'Reiniciando auditoría de almacén externo...' : 'Abriendo nueva sesión de inventario para toda la sede...');
                try {
                    const data = await fetchGAS({
                        action: soloLimpiarInmunes ? 'reiniciarAuditoriaInmunes' : 'abrirNuevaSesionInventario',
                        sede: sedeActual,
                        usuario: operadorNombre
                    });
                    if (data.status === 'success') {
                        recentLocalScansRef.current = {};
                        if (soloLimpiarInmunes) {
                            setExpedientes(prev => prev.map(e => ({ ...e, invInmuneFecha: '', invInmuneCajero: '' })));
                        } else {
                            setExpedientes(prev => prev.map(e => ({ ...e, invFecha: '', invCajero: '', invSesion: '' })));
                            setCierreInfo(data.cierreInfo || { cerrado: false });
                        }
                        setScanLog([]);
                        setAlertasEscaneo([]);
                        setScanFeedback(null);
                        playSound('beep');
                    }
                } catch (e) {
                    alert('Error al abrir nueva sesión.');
                }
                setIsLoading(false);
            };

            // =====================================================================
            // CÁLCULO EN VIVO DE CONTADORES (FÍSICOS + INMUNIDAD = HABIDOS) Y BLOQUES
            // =====================================================================
            const totalFisicosEscaneados = React.useMemo(() => {
                return expedientes.filter(e => estaContabilizadoFisicoEnSesion(e)).length;
            }, [expedientes]);

            const totalInmunesConsiderados = React.useMemo(() => {
                return expedientes.filter(e => !estaContabilizadoFisicoEnSesion(e) && esExpedienteInmune(e, categoriasInmunes)).length;
            }, [expedientes, categoriasInmunes]);

            const totalHabidosInventario = React.useMemo(() => {
                return expedientes.filter(e => estaHabidoEnInventario(e, categoriasInmunes)).length;
            }, [expedientes, categoriasInmunes]);

            const desglosePorCajeroVivo = React.useMemo(() => {
                const mapa = {};
                expedientes.forEach(e => {
                    if (estaContabilizadoFisicoEnSesion(e)) {
                        const cj = String(e.invCajero || 'CAJA').toUpperCase();
                        mapa[cj] = (mapa[cj] || 0) + 1;
                    }
                });
                return Object.entries(mapa);
            }, [expedientes]);

            const maxNumExpediente = React.useMemo(() => {
                const paso = Math.max(1, bloqueTamano || 50);
                let max = paso;
                expedientes.forEach(e => {
                    const n = parseInt(normalizarIdNatural(e.id), 10);
                    if (!isNaN(n) && n > max) max = n;
                });
                return Math.ceil(max / paso) * paso;
            }, [expedientes, bloqueTamano]);

            const bloquesPredefinidos = React.useMemo(() => {
                const paso = Math.max(1, bloqueTamano || 50);
                const arr = [];
                const limite = Math.min(maxNumExpediente, 3000);
                for (let ini = 1; ini <= limite; ini += paso) {
                    const fin = ini + paso - 1;
                    const expsEnBloque = expedientes.filter(e => {
                        const n = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(n) && n >= ini && n <= fin;
                    });
                    const listos = expsEnBloque.filter(e => estaHabidoEnInventario(e, categoriasInmunes)).length;
                    arr.push({
                        ini,
                        fin,
                        total: expsEnBloque.length,
                        listos,
                        completo: expsEnBloque.length > 0 && listos === expsEnBloque.length
                    });
                }
                return arr;
            }, [expedientes, maxNumExpediente, bloqueTamano, categoriasInmunes]);

            const expedientesTablaVivo = React.useMemo(() => {
                let lista = [...expedientes];

                if (modoAuditoriaInmunes) {
                    lista = lista.filter(e => esExpedienteInmune(e, categoriasInmunes));
                }

                const d = parseInt(bloqueDesde, 10);
                const h = parseInt(bloqueHasta, 10);

                if (!isNaN(d) || !isNaN(h)) {
                    const minR = !isNaN(d) ? d : 1;
                    const maxR = !isNaN(h) ? h : 999999;
                    lista = lista.filter(e => {
                        const num = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(num) && num >= minR && num <= maxR;
                    });
                    lista.sort((a, b) => parseInt(normalizarIdNatural(a.id), 10) - parseInt(normalizarIdNatural(b.id), 10));
                }

                if (soloFaltantesBloque) {
                    lista = lista.filter(e => modoAuditoriaInmunes
                        ? !(e.invInmuneFecha && String(e.invInmuneFecha).trim() !== '')
                        : !estaHabidoEnInventario(e, categoriasInmunes)
                    );
                }

                if (liveTableSearch.trim() !== '') {
                    const q = liveTableSearch.toUpperCase().trim();
                    const qNat = normalizarIdNatural(q);
                    lista = lista.filter(e => {
                        const idNat = normalizarIdNatural(e.id);
                        const enIntegrantes = Array.isArray(e.integrantes) && e.integrantes.some(intg => String(intg).toUpperCase().includes(q));
                        return e.cliente.includes(q) || enIntegrantes || String(e.id).includes(q) || (qNat && idNat === qNat);
                    });
                }
                return lista;
            }, [expedientes, bloqueDesde, bloqueHasta, soloFaltantesBloque, liveTableSearch, modoAuditoriaInmunes, categoriasInmunes]);

            const resumenBloqueActivo = React.useMemo(() => {
                const d = parseInt(bloqueDesde, 10);
                const h = parseInt(bloqueHasta, 10);
                if (isNaN(d) || isNaN(h) || d > h) return null;

                const enRango = expedientes.filter(e => {
                    const num = parseInt(normalizarIdNatural(e.id), 10);
                    return !isNaN(num) && num >= d && num <= h;
                });
                const habidos = enRango.filter(e => estaHabidoEnInventario(e, categoriasInmunes));
                const pendientes = enRango.filter(e => !estaHabidoEnInventario(e, categoriasInmunes));
                pendientes.sort((a, b) => parseInt(normalizarIdNatural(a.id), 10) - parseInt(normalizarIdNatural(b.id), 10));

                return {
                    desde: d,
                    hasta: h,
                    totalRegistrados: enRango.length,
                    escaneadosCount: habidos.length,
                    pendientesCount: pendientes.length,
                    completo: enRango.length > 0 && pendientes.length === 0,
                    listaPendientes: pendientes.map(p => `${normalizarIdNatural(p.id)}${normalizarRubro(p.rubro) === 'GRUPAL' ? '[GRP]' : ''} (${p.cliente.split(' ')[0]})`)
                };
            }, [expedientes, bloqueDesde, bloqueHasta, categoriasInmunes]);

            // =====================================================================
            // REGISTRO, EDICIÓN, GRUPALES (MÍN 3 / ESTÁNDAR 6) E INMUNIDAD EDITABLE
            // =====================================================================
            const [formInv, setFormInv] = React.useState({
                rubro: 'INDIVIDUAL',
                idExp: '',
                cliente: '',
                integrantes: ['', '', '', '', '', ''],
                estadoCredito: 'ACTIVO',
                asesorTitular: '',
                categoriaExtra: '',
                inmunidadManual: 'AUTO',
                generarTicket: true
            });
            const [editMode, setEditMode] = React.useState(null);
            const [historialVisible, setHistorialVisible] = React.useState(null);
            const [modalIntegrantesVisible, setModalIntegrantesVisible] = React.useState(null);
            const csvInputRef = React.useRef(null);

            const actualizarIntegranteForm = (idx, valor) => {
                const copia = [...formInv.integrantes];
                copia[idx] = valor.toUpperCase();
                setFormInv({ ...formInv, integrantes: copia });
            };

            const registrarExpediente = async (e) => {
                e.preventDefault();
                if (!puedeGestionarBase) return;
                if (!formInv.asesorTitular) return alert("Debes seleccionar un Asesor Titular.");
                if (!formInv.idExp) return alert("Ingresa el N° de Expediente.");

                const rubroElegido = normalizarRubro(formInv.rubro);
                let idNatural = normalizarIdNatural(formInv.idExp);
                if (!idNatural || !/\d+/.test(idNatural)) return alert("El N° de Expediente debe contener números.");

                let integrantesLimpios = [];
                if (rubroElegido === 'GRUPAL') {
                    integrantesLimpios = (formInv.integrantes || []).map(x => String(x || '').toUpperCase().trim()).filter(Boolean);
                    if (integrantesLimpios.length < 3) {
                        return alert("⚠️ Un Expediente Grupal debe tener como mínimo 3 integrantes registrados (el estándar es 6 o más).");
                    }
                }

                while (expedientes.some(x => normalizarRubro(x.rubro) === rubroElegido && normalizarIdNatural(x.id) === idNatural)) {
                    const correccion = prompt(`❌ EXPEDIENTE DUPLICADO EN RUBRO ${rubroElegido}.\nEl Expediente ${rubroElegido} N° ${idNatural} ya existe en ${sedeActual}.\n\nIngresa otro N°:`);
                    if (correccion === null || correccion.trim() === '') return;
                    idNatural = normalizarIdNatural(correccion);
                }

                const inmuneInicial = formInv.inmunidadManual === 'INMUNE' || (formInv.inmunidadManual === 'AUTO' && categoriasInmunes.includes(formInv.estadoCredito));
                const nombrePrincipal = formInv.cliente.toUpperCase().trim();

                const nuevo = {
                    id: idNatural,
                    rubro: rubroElegido,
                    dni: 'NO IDENTIFICADO',
                    cliente: nombrePrincipal,
                    integrantes: integrantesLimpios,
                    estadoCredito: formInv.estadoCredito,
                    asesorTitular: formInv.asesorTitular,
                    ubicacionFisica: inmuneInicial ? 'ALMACÉN EXTERNO (INMUNE)' : 'CAJA (ARCHIVO)',
                    inmunidadManual: formInv.inmunidadManual,
                    fechaUltimoMov: getFechaHora(),
                    invFecha: '',
                    invCajero: '',
                    invSesion: '',
                    invInmuneFecha: '',
                    invInmuneCajero: '',
                    categoriaExtra: formInv.categoriaExtra.toUpperCase().trim(),
                    historial: [{
                        fecha: getFechaHora(),
                        accion: `CREACIÓN (${rubroElegido})`,
                        detalle: `Ingreso inicial por ${operadorNombre}${rubroElegido === 'GRUPAL' ? ` | Grupo de ${integrantesLimpios.length} integrantes` : ''}${inmuneInicial ? ' | Con Inmunidad (Almacén Externo)' : ''}`
                    }]
                };

                setExpedientes([nuevo, ...expedientes]);
                if (formInv.generarTicket) {
                    setTicketsQueue([...ticketsQueue, {
                        id: formatearConCeros(idNatural, rubroElegido),
                        idNat: idNatural,
                        rubro: rubroElegido,
                        cliente: rubroElegido === 'GRUPAL' ? `GRP: ${nombrePrincipal} (${integrantesLimpios.length} INT.)` : nombrePrincipal,
                        sede: sedeActual
                    }]);
                }
                setFormInv({
                    rubro: rubroElegido,
                    idExp: '',
                    cliente: '',
                    integrantes: ['', '', '', '', '', ''],
                    estadoCredito: 'ACTIVO',
                    asesorTitular: '',
                    categoriaExtra: '',
                    inmunidadManual: 'AUTO',
                    generarTicket: formInv.generarTicket
                });

                await syncExpedienteCloud(nuevo);
                playSound('beep');
                alert(`✅ Expediente ${rubroElegido} N° ${idNatural} registrado en la nube.`);
            };

            const guardarEdicionExpediente = async (expActual) => {
                if (!puedeEditarBase || !editMode) return;
                const rubroEdit = normalizarRubro(editMode.nuevoRubro || expActual.rubro);
                let integrantesEdit = [];
                if (rubroEdit === 'GRUPAL') {
                    integrantesEdit = (editMode.nuevosIntegrantes || []).map(x => String(x || '').toUpperCase().trim()).filter(Boolean);
                    if (integrantesEdit.length < 3) {
                        return alert("⚠️ Un Expediente Grupal requiere mínimo 3 integrantes.");
                    }
                }

                setIsLoading(true);
                setLoadingMsg('Guardando cambios del expediente en Google Sheets...');
                try {
                    const data = await fetchGAS({
                        action: 'editarCategorizacion',
                        sede: sedeActual,
                        id: expActual.id,
                        rubro: rubroEdit,
                        cliente: editMode.nuevoCliente,
                        integrantes: integrantesEdit,
                        estadoCredito: editMode.nuevoEstado,
                        asesorTitular: editMode.nuevoAsesor,
                        ubicacionFisica: editMode.nuevaUbicacion,
                        inmunidadManual: editMode.nuevaInmunidad,
                        categoriaExtra: editMode.nuevaCatExtra,
                        usuario: operadorNombre
                    });
                    if (data.status === 'success') {
                        const ahora = getFechaHora();
                        const cambioInmunidad = (expActual.inmunidadManual || 'AUTO') !== editMode.nuevaInmunidad;
                        const nuevoHist = [...(expActual.historial || [])];
                        nuevoHist.unshift({
                            fecha: ahora,
                            accion: `EDICIÓN (${operadorNombre})`,
                            detalle: `Rubro: ${rubroEdit} | Estado: ${editMode.nuevoEstado} | Titular: ${editMode.nuevoAsesor} | Ubic: ${editMode.nuevaUbicacion}${cambioInmunidad ? ` | Inmunidad: ${editMode.nuevaInmunidad}` : ''}`
                        });
                        const actualizado = {
                            ...expActual,
                            rubro: rubroEdit,
                            cliente: editMode.nuevoCliente.toUpperCase(),
                            integrantes: integrantesEdit,
                            estadoCredito: editMode.nuevoEstado,
                            asesorTitular: editMode.nuevoAsesor,
                            ubicacionFisica: editMode.nuevaUbicacion,
                            inmunidadManual: editMode.nuevaInmunidad,
                            categoriaExtra: editMode.nuevaCatExtra.toUpperCase(),
                            fechaUltimoMov: ahora,
                            historial: nuevoHist
                        };
                        const claveOriginal = obtenerClaveUnicaExp(expActual);
                        setExpedientes(expedientes.map(x => obtenerClaveUnicaExp(x) === claveOriginal ? actualizado : x));
                        setEditMode(null);
                        playSound('beep');
                    } else {
                        alert(`❌ Error: ${data.message}`);
                    }
                } catch (e) {
                    alert('❌ Error al actualizar el expediente.');
                }
                setIsLoading(false);
            };

            // =====================================================================
            // BUSCADOR MANUAL DE PRÉSTAMOS / DEVOLUCIONES (SOLO ASESORES ACTIVOS)
            // =====================================================================
            const [movBusqueda, setMovBusqueda] = React.useState('');
            const [sugerencias, setSugerencias] = React.useState([]);
            const [expEncontrado, setExpEncontrado] = React.useState(null);

            const handleLiveSearch = (e) => {
                const val = e.target.value.toUpperCase();
                setMovBusqueda(val);
                if (val.length < 1) { setSugerencias([]); return; }
                const termNat = normalizarIdNatural(val);
                
                const matches = expedientes.filter(exp => {
                    const idNat = normalizarIdNatural(exp.id);
                    const enIntegrantes = Array.isArray(exp.integrantes) && exp.integrantes.some(intg => String(intg).toUpperCase().includes(val));
                    return exp.cliente.includes(val) || enIntegrantes || (termNat && (idNat === termNat || idNat.includes(termNat)));
                });
                setSugerencias(matches.slice(0, 8));
            };

            const seleccionarExpediente = (exp) => { setExpEncontrado(exp); setMovBusqueda(''); setSugerencias([]); };

            const prestarExpediente = async (quienPresta) => {
                if (!puedeOperarCaja) return;
                if (!quienPresta) return alert("Selecciona un asesor activo a quien se entrega el expediente.");
                const clave = obtenerClaveUnicaExp(expEncontrado);
                const expActualizado = { ...expEncontrado, ubicacionFisica: `CON ASESOR: ${quienPresta}`, fechaUltimoMov: getFechaHora() };
                expActualizado.historial = [{ fecha: getFechaHora(), accion: 'PRÉSTAMO', detalle: `Entregado físico a ${quienPresta} por ${operadorNombre}` }, ...(expEncontrado.historial || [])];
                setExpedientes(expedientes.map(e => obtenerClaveUnicaExp(e) === clave ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                playSound('beep');
                alert(`✅ Expediente prestado a ${quienPresta}`);
            };

            const devolverCaja = async (ubicacionDestino = 'CAJA (ARCHIVO)') => {
                if (!puedeOperarCaja) return;
                const clave = obtenerClaveUnicaExp(expEncontrado);
                const expActualizado = { ...expEncontrado, ubicacionFisica: ubicacionDestino, fechaUltimoMov: getFechaHora() };
                expActualizado.historial = [{ fecha: getFechaHora(), accion: 'DEVOLUCIÓN', detalle: `Retornado a ${ubicacionDestino} por ${operadorNombre}` }, ...(expEncontrado.historial || [])];
                setExpedientes(expedientes.map(e => obtenerClaveUnicaExp(e) === clave ? expActualizado : e));
                setExpEncontrado(null);
                await syncExpedienteCloud(expActualizado);
                playSound('beep');
                alert(`✅ Expediente retornado a ${ubicacionDestino}.`);
            };

            // =====================================================================
            // FILTROS Y BUSCADOR DE SEDE (DASHBOARD)
            // =====================================================================
            const [dashSearchQuery, setDashSearchQuery] = React.useState('');
            const [dashFilterAsesor, setDashFilterAsesor] = React.useState('TODOS');
            const [dashFilterEstado, setDashFilterEstado] = React.useState('TODOS');
            const [dashFilterRubro, setDashFilterRubro] = React.useState('TODOS');
            const [dashFiltroUbicacion, setDashFiltroUbicacion] = React.useState('TODOS');
            const [dashFiltroInv, setDashFiltroInv] = React.useState('TODOS');
            const [modalReporte, setModalReporte] = React.useState(false);

            let listaDash = expedientes;
            if (dashSearchQuery.trim() !== '') {
                const q = dashSearchQuery.toUpperCase().trim();
                const qNat = normalizarIdNatural(q);
                listaDash = listaDash.filter(e => {
                    const idNat = normalizarIdNatural(e.id);
                    const enIntegrantes = Array.isArray(e.integrantes) && e.integrantes.some(intg => String(intg).toUpperCase().includes(q));
                    return e.cliente.includes(q) || enIntegrantes || String(e.id).includes(q) || (qNat && idNat.includes(qNat));
                });
            }
            if (dashFilterAsesor !== 'TODOS') listaDash = listaDash.filter(e => e.asesorTitular === dashFilterAsesor);
            if (dashFilterEstado !== 'TODOS') listaDash = listaDash.filter(e => e.estadoCredito === dashFilterEstado);
            if (dashFilterRubro !== 'TODOS') listaDash = listaDash.filter(e => normalizarRubro(e.rubro) === dashFilterRubro);
            if (dashFiltroUbicacion === 'CAJA') listaDash = listaDash.filter(e => e.ubicacionFisica.includes('CAJA'));
            if (dashFiltroUbicacion === 'CAMPO') listaDash = listaDash.filter(e => !e.ubicacionFisica.includes('CAJA') && !esExpedienteInmune(e, categoriasInmunes));
            if (dashFiltroUbicacion === 'INMUNE') listaDash = listaDash.filter(e => esExpedienteInmune(e, categoriasInmunes));
            if (dashFiltroInv === 'CONTABILIZADO') listaDash = listaDash.filter(e => estaContabilizadoFisicoEnSesion(e));
            if (dashFiltroInv === 'INMUNE_HABIDO') listaDash = listaDash.filter(e => esExpedienteInmune(e, categoriasInmunes));
            if (dashFiltroInv === 'HABIDO_TOTAL') listaDash = listaDash.filter(e => estaHabidoEnInventario(e, categoriasInmunes));
            if (dashFiltroInv === 'FALTANTE') listaDash = listaDash.filter(e => !estaHabidoEnInventario(e, categoriasInmunes));

            // EXPORTACIÓN CSV Y PDF (CON LOGO OFICIAL + DESGLOSE POR CATEGORÍAS CON COLORES)
            const exportarCSV = (soloSeleccionFiltrada = false) => {
                if (!puedeExportarCSV) return alert("⛔ No tienes autorización de Gerencia para exportar registros.");
                const fuente = soloSeleccionFiltrada ? listaDash : expedientes;
                if (fuente.length === 0) return alert("No hay datos para exportar.");
                const now = new Date();
                const fileName = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()} - EXPEDIENTES_${sedeActual}.csv`;

                let csv = "ID_Expediente,Rubro,DNI,Cliente_o_Grupo,Integrantes_Grupo,Estado_Credito,Inmunidad,Asesor_Titular,Ubicacion_Fisica,Fecha_Ultimo_Movimiento,Inventario_Fecha,Inventario_Cajero,Categoria_Extra,Historial_JSON\n";
                fuente.forEach(e => { 
                    const histStr = JSON.stringify(e.historial || []).replace(/"/g, '""');
                    const intgStr = Array.isArray(e.integrantes) ? e.integrantes.join(' | ') : '';
                    const inmuneTxt = esExpedienteInmune(e, categoriasInmunes) ? 'CON INMUNIDAD' : 'NORMAL';
                    csv += `"${e.id}","${normalizarRubro(e.rubro)}","NO IDENTIFICADO","${e.cliente}","${intgStr}","${e.estadoCredito}","${inmuneTxt}","${e.asesorTitular}","${e.ubicacionFisica}","${e.fechaUltimoMov}","${e.invFecha || ''}","${e.invCajero || ''}","${e.categoriaExtra || ''}","${histStr}"\n`; 
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const obtenerColorCategoriaPDF = (categoria) => {
                const cat = String(categoria || '').toUpperCase();
                if (cat === 'ACTIVO') return { fill: [22, 163, 74], text: [255, 255, 255], light: [240, 253, 244] };
                if (cat === 'MORA DURA') return { fill: [220, 38, 38], text: [255, 255, 255], light: [254, 242, 242] };
                if (cat === 'LISTA NEGRA') return { fill: [30, 41, 59], text: [255, 255, 255], light: [241, 245, 249] };
                if (cat === 'CANCELADO') return { fill: [37, 99, 235], text: [255, 255, 255], light: [239, 246, 255] };
                if (cat === 'JUDICIAL') return { fill: [126, 34, 206], text: [255, 255, 255], light: [250, 245, 255] };
                if (cat === 'REPROGRAMADO') return { fill: [217, 119, 6], text: [255, 255, 255], light: [255, 251, 235] };
                return { fill: [71, 85, 105], text: [255, 255, 255], light: [248, 250, 252] };
            };

            const generarReportePDF = (tipoReporte) => {
                if (!puedeExportarPDF) return alert("⛔ No tienes autorización de Gerencia para exportar reportes PDF.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                const logoBase64 = generarLogoCredibanBase64();
                const dibujarEncabezadoPDF = () => {
                    if (logoBase64) {
                        doc.addImage(logoBase64, 'PNG', 14, 10, 62, 17.5);
                    } else {
                        doc.setFont("georgia", "bold"); doc.setTextColor(89, 180, 71); doc.setFontSize(22);
                        doc.text("CREDIBAN", 14, 20);
                    }
                    doc.setFont("helvetica", "bold"); doc.setTextColor(30, 41, 59); doc.setFontSize(10);
                    doc.text(`SEDE: ${sedeActual}`, 196, 15, { align: 'right' });
                    doc.setFont("helvetica", "normal"); doc.setTextColor(100, 116, 139); doc.setFontSize(8);
                    doc.text(`Emitido por: ${operadorNombre} (${rolSistema})`, 196, 20, { align: 'right' });
                    doc.text(`Fecha y Hora: ${getFechaHora()}`, 196, 24.5, { align: 'right' });

                    doc.setDrawColor(89, 180, 71);
                    doc.setLineWidth(0.7);
                    doc.line(14, 29, 196, 29);
                };

                dibujarEncabezadoPDF();

                doc.setTextColor(51, 65, 85); doc.setFontSize(8.5); doc.setFont("helvetica", "bold");
                const filtroTexto = `Filtros aplicados -> Rubro: ${dashFilterRubro} | Asesor: ${dashFilterAsesor} | Estado: ${dashFilterEstado} | Ubicación: ${dashFiltroUbicacion} | Inv: ${dashFiltroInv}`;
                doc.text(filtroTexto, 14, 34.5);

                const enCajaCount = listaDash.filter(e => e.ubicacionFisica.includes('CAJA')).length;
                const prestadosCount = listaDash.filter(e => !e.ubicacionFisica.includes('CAJA') && !esExpedienteInmune(e, categoriasInmunes)).length;
                const inmunesCount = listaDash.filter(e => esExpedienteInmune(e, categoriasInmunes)).length;
                const escaneadosFisicosCount = listaDash.filter(e => estaContabilizadoFisicoEnSesion(e)).length;
                const habidosTotalesCount = listaDash.filter(e => estaHabidoEnInventario(e, categoriasInmunes)).length;
                const individualesCount = listaDash.filter(e => normalizarRubro(e.rubro) === 'INDIVIDUAL').length;
                const grupalesCount = listaDash.filter(e => normalizarRubro(e.rubro) === 'GRUPAL').length;

                const categoriasUnicas = [...new Set([...estadosDisponibles, ...listaDash.map(e => e.estadoCredito)])].filter(Boolean);
                const filasCategoriasResumen = categoriasUnicas.map(cat => {
                    const sub = listaDash.filter(e => e.estadoCredito === cat);
                    const esInm = categoriasInmunes.includes(cat);
                    return [
                        `${cat}${esInm ? ' (CON INMUNIDAD)' : ''}`,
                        sub.length,
                        sub.filter(e => estaHabidoEnInventario(e, categoriasInmunes)).length,
                        sub.filter(e => !estaHabidoEnInventario(e, categoriasInmunes)).length
                    ];
                }).filter(r => r[1] > 0);

                doc.autoTable({
                    startY: 38,
                    head: [['RESUMEN GLOBAL DE EXPEDIENTES (SELECCIÓN ACTUAL)', 'CANTIDAD']],
                    body: [
                        ['Total de Expedientes Evaluados', `${listaDash.length} (${individualesCount} Individuales / ${grupalesCount} Grupales)`],
                        ['Resguardados en Caja Principal', enCajaCount],
                        ['Prestados en Campo con Asesores Activos', prestadosCount],
                        ['Almacén Externo con Inmunidad (Contabilizados como Habidos)', inmunesCount],
                        ['Escaneados Físicamente por QR en Sesión', escaneadosFisicosCount],
                        ['TOTAL HABIDOS EN INVENTARIO (Escaneados + Inmunes)', `${habidosTotalesCount} de ${listaDash.length}`],
                        ['Pendientes / Faltantes por Verificar', listaDash.length - habidosTotalesCount]
                    ],
                    theme: 'grid',
                    styles: { fontSize: 8.5, cellPadding: 2.2 },
                    headStyles: { fillColor: [89, 180, 71], textColor: [255, 255, 255], fontStyle: 'bold' },
                    columnStyles: { 1: { fontStyle: 'bold', halign: 'center', cellWidth: 55 } }
                });

                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 4,
                    head: [['RESUMEN POR CATEGORÍA', 'TOTAL', 'HABIDOS', 'PENDIENTES']],
                    body: filasCategoriasResumen,
                    theme: 'grid',
                    styles: { fontSize: 8, cellPadding: 2 },
                    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255] },
                    columnStyles: { 1: { halign: 'center' }, 2: { halign: 'center' }, 3: { halign: 'center' } }
                });

                if (tipoReporte === 'DETALLADO') {
                    let currentY = doc.lastAutoTable.finalY + 7;

                    categoriasUnicas.forEach(cat => {
                        const grupoCat = listaDash.filter(e => e.estadoCredito === cat);
                        if (grupoCat.length === 0) return;

                        if (currentY > 255) {
                            doc.addPage();
                            dibujarEncabezadoPDF();
                            currentY = 35;
                        }

                        const paleta = obtenerColorCategoriaPDF(cat);
                        const esCatInmune = categoriasInmunes.includes(cat);

                        doc.setFillColor(...paleta.fill);
                        doc.roundedRect(14, currentY, 182, 7.5, 1.5, 1.5, 'F');
                        doc.setFont("helvetica", "bold");
                        doc.setFontSize(9);
                        doc.setTextColor(...paleta.text);
                        doc.text(
                            `CATEGORÍA: ${cat} (${grupoCat.length} EXP.)${esCatInmune ? ' — 🛡️ CATEGORÍA CON INMUNIDAD (ALMACÉN EXTERNO)' : ''}`,
                            17,
                            currentY + 5
                        );

                        const filasCat = grupoCat.map(e => {
                            const rub = normalizarRubro(e.rubro);
                            const codTxt = `${normalizarIdNatural(e.id)}${rub === 'GRUPAL' ? ' [GRP]' : ''}`;
                            const cliTxt = rub === 'GRUPAL' && Array.isArray(e.integrantes) && e.integrantes.length > 0
                                ? `${e.cliente} (${e.integrantes.length} int.)`
                                : e.cliente;
                            const inmExp = esExpedienteInmune(e, categoriasInmunes);
                            const invEstado = estaContabilizadoFisicoEnSesion(e)
                                ? `ESCANEADO (${e.invCajero})`
                                : inmExp
                                    ? 'HABIDO (INMUNE)'
                                    : 'PENDIENTE';
                            return [codTxt, cliTxt, e.asesorTitular, e.ubicacionFisica, invEstado];
                        });

                        doc.autoTable({
                            startY: currentY + 8.5,
                            head: [['N° EXP', 'CLIENTE / GRUPO', 'TITULAR', 'UBICACIÓN FÍSICA', 'INVENTARIO']],
                            body: filasCat,
                            theme: 'grid',
                            styles: { fontSize: 7.5, cellPadding: 1.8 },
                            headStyles: { fillColor: paleta.light, textColor: [30, 41, 59], fontStyle: 'bold', lineWidth: 0.1, lineColor: [203, 213, 225] },
                            alternateRowStyles: { fillColor: [252, 252, 253] },
                            didDrawPage: () => {}
                        });

                        currentY = doc.lastAutoTable.finalY + 6;
                    });
                }

                doc.save(`Reporte_Crediban_${sedeActual}_${tipoReporte}_${Date.now()}.pdf`);
                setModalReporte(false);
            };

            const parseCSVLine = (line) => {
                const cleanLine = String(line || '').replace(/\r/g, '');
                const result = []; let current = ''; let inQuotes = false;
                for (let i = 0; i < cleanLine.length; i++) {
                    const char = cleanLine[i];
                    if (char === '"') {
                        if (inQuotes && cleanLine[i+1] === '"') { current += '"'; i++; } 
                        else { inQuotes = !inQuotes; }
                    }
                    else if ((char === ',' || char === ';') && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                return result.map(s => s.replace(/^"|"$/g, '').trim());
            };

            const importarCSV = async (e) => {
                if (!puedeGestionarBase) return;
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const lines = evt.target.result.split('\n');
                    let count = 0; let nuevos = [...expedientes];
                    let listaParaLaNube = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = parseCSVLine(lines[i]);
                        if (cols.length >= 2) {
                            const idNatural = normalizarIdNatural(cols[0]);
                            const tieneColDNI = cols.length >= 5;
                            const cliente = (tieneColDNI ? cols[2] : cols[1] || '').toUpperCase().trim();
                            const estado = (tieneColDNI ? cols[3] : cols[2] || 'ACTIVO').toUpperCase().trim();
                            const asesor = (tieneColDNI ? cols[4] : cols[3] || 'POR DEFINIR').toUpperCase().trim();
                            const rubroCol = (cols[6] && cols[6].toUpperCase().includes('GRUP')) ? 'GRUPAL' : 'INDIVIDUAL';
                            const esInm = categoriasInmunes.includes(estado);
                            const ubicacionFisica = (tieneColDNI && cols[5] ? cols[5] : (esInm ? 'ALMACÉN EXTERNO (INMUNE)' : 'CAJA (ARCHIVO)')).toUpperCase().trim();
                            const fechaUltimoMov = getFechaHora();

                            if (idNatural && cliente && !nuevos.some(x => normalizarRubro(x.rubro) === rubroCol && normalizarIdNatural(x.id) === idNatural)) {
                                const exp = {
                                    id: idNatural,
                                    rubro: rubroCol,
                                    dni: 'NO IDENTIFICADO',
                                    cliente,
                                    integrantes: [],
                                    estadoCredito: estado || 'ACTIVO',
                                    asesorTitular: asesor || 'POR DEFINIR',
                                    ubicacionFisica,
                                    inmunidadManual: 'AUTO',
                                    fechaUltimoMov,
                                    historial: [{ fecha: fechaUltimoMov, accion: 'MIGRACIÓN CSV', detalle: `Cargado por ${operadorNombre}` }],
                                    invFecha: '', invCajero: '', invSesion: '', invInmuneFecha: '', invInmuneCajero: '', categoriaExtra: ''
                                };
                                nuevos.push(exp);
                                listaParaLaNube.push(exp);
                                count++;
                            }
                        }
                    }
                    setExpedientes(nuevos);
                    if (listaParaLaNube.length > 0) {
                        setIsLoading(true);
                        setLoadingMsg('Subiendo lote masivo a Google Sheets...');
                        await fetchGAS({ action: 'bulkSave', sede: sedeActual, usuario: operadorNombre, data: listaParaLaNube });
                        setIsLoading(false);
                        playSound('beep');
                        alert(`✅ Carga Exitosa: Se integraron ${count} expedientes a ${sedeActual}.`);
                    }
                };
                reader.readAsText(file); e.target.value = '';
            };

            // =====================================================================
            // GENERADOR DE TICKETS QR + EXPORTADOR NATIVO A PDF A4
            // =====================================================================
            const [manualId, setManualId] = React.useState('');
            const [manualCliente, setManualCliente] = React.useState('');
            const [manualRubro, setManualRubro] = React.useState('INDIVIDUAL');
            const [rangoDesde, setRangoDesde] = React.useState('');
            const [rangoHasta, setRangoHasta] = React.useState('');
            const [excelPasteText, setExcelPasteText] = React.useState('');

            const obtenerCodigoVisibleTicket = (idRaw, rubro = 'INDIVIDUAL') => {
                return printConfig.formatoCodigoRojo === 'NATURAL'
                    ? `${normalizarRubro(rubro) === 'GRUPAL' ? 'GRP-' : ''}${normalizarIdNatural(idRaw)}`
                    : formatearConCeros(idRaw, rubro);
            };

            const armarPayloadQR = (ticket) => {
                const sedeT = ticket.sede || sedeActual;
                const rubT = normalizarRubro(ticket.rubro);
                const codFormal = formatearConCeros(ticket.id, rubT);
                if (printConfig.qrDataMode === 'MINIMO') return codFormal;
                if (printConfig.qrDataMode === 'COMPACTO') return `${sedeT}|${codFormal}`;
                return `${sedeT}|${codFormal}|${ticket.cliente}`;
            };

            const agregarTicketManual = (e) => {
                e.preventDefault();
                if (!manualId || !manualCliente) return;
                const idNat = normalizarIdNatural(manualId);
                if (!idNat) return alert("El N° de Expediente debe contener números.");
                const rub = normalizarRubro(manualRubro);
                setTicketsQueue([...ticketsQueue, { id: formatearConCeros(idNat, rub), idNat, rubro: rub, cliente: manualCliente.toUpperCase().trim(), sede: sedeActual }]);
                setManualId(''); setManualCliente('');
            };

            const cargarTicketsDesdeBase = (soloRango = false) => {
                if (expedientes.length === 0) return alert("No hay expedientes en la base de esta sede.");
                let filtrados = [...expedientes];
                if (soloRango) {
                    const d = parseInt(rangoDesde.replace(/\D/g, ''), 10) || 1;
                    const h = parseInt(rangoHasta.replace(/\D/g, ''), 10) || 999999;
                    filtrados = filtrados.filter(e => {
                        const num = parseInt(normalizarIdNatural(e.id), 10);
                        return !isNaN(num) && num >= d && num <= h;
                    });
                }
                if (filtrados.length === 0) return alert("Ningún expediente coincide con ese rango.");
                filtrados.sort((a, b) => parseInt(normalizarIdNatural(a.id), 10) - parseInt(normalizarIdNatural(b.id), 10));
                const nuevosTickets = filtrados.map(e => {
                    const rub = normalizarRubro(e.rubro);
                    return {
                        id: formatearConCeros(e.id, rub),
                        idNat: normalizarIdNatural(e.id),
                        rubro: rub,
                        cliente: rub === 'GRUPAL' ? `GRP: ${e.cliente}` : e.cliente,
                        sede: sedeActual
                    };
                });
                setTicketsQueue([...ticketsQueue, ...nuevosTickets]);
                alert(`✅ Se cargaron ${nuevosTickets.length} etiquetas QR a la cola de impresión.`);
            };

            const procesarPegadoMasivoExcel = () => {
                if (!excelPasteText.trim()) return;
                const lineas = excelPasteText.trim().split('\n');
                const generados = [];
                lineas.forEach(l => {
                    const partes = l.split(/\t|,|;/).map(s => s.trim()).filter(Boolean);
                    if (partes.length >= 2) {
                        const esGrp = String(partes[0]).toUpperCase().includes('GRP');
                        const rub = esGrp ? 'GRUPAL' : 'INDIVIDUAL';
                        const idNat = normalizarIdNatural(partes[0]);
                        const cli = partes.slice(1).join(' ').toUpperCase();
                        if (idNat && cli) generados.push({ id: formatearConCeros(idNat, rub), idNat, rubro: rub, cliente: cli, sede: sedeActual });
                    }
                });
                if (generados.length === 0) return alert("Pega al menos 2 columnas desde Excel: N° Expediente y Nombre del Cliente.");
                setTicketsQueue([...ticketsQueue, ...generados]);
                setExcelPasteText('');
                alert(`✅ Se generaron ${generados.length} etiquetas QR listas para imprimir.`);
            };

            const descargarTicketsPDFExacto = () => {
                if (ticketsQueue.length === 0) return alert("Primero añade etiquetas a la cola de impresión.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                const marginX = 5;
                const marginY = 6;
                const colWidth = 50;
                const rowHeight = Math.min(46, Math.max(36, printConfig.ticketHeightMm || 40));

                printPages.forEach((page, pageIndex) => {
                    if (pageIndex > 0) doc.addPage();

                    page.forEach((t, idx) => {
                        const col = idx % 4;
                        const row = Math.floor(idx / 4);
                        const x = marginX + col * colWidth;
                        const y = marginY + row * rowHeight;

                        doc.setDrawColor(0, 0, 0);
                        doc.setLineWidth(0.45);
                        doc.rect(x, y, colWidth, rowHeight);

                        const headerH = printConfig.showHeaderSede ? 4.5 : 0;
                        const footerH = 11.5;
                        const bodyY = y + headerH;
                        const bodyH = rowHeight - headerH - footerH;

                        if (printConfig.showHeaderSede) {
                            doc.line(x, y + headerH, x + colWidth, y + headerH);
                            if (!t.isEmpty) {
                                doc.setFont("helvetica", "bold");
                                doc.setFontSize(6.5);
                                doc.setTextColor(0, 0, 0);
                                doc.text(String(t.sede || sedeActual), x + 1.5, y + 3.2);
                                doc.setTextColor(110, 110, 110);
                                doc.text(normalizarRubro(t.rubro) === 'GRUPAL' ? "GRUPAL" : "CREDIBAN", x + colWidth - 1.5, y + 3.2, { align: "right" });
                            }
                        }

                        doc.line(x, y + rowHeight - footerH, x + colWidth, y + rowHeight - footerH);

                        if (!t.isEmpty) {
                            const qrCanvas = document.createElement('canvas');
                            new window.QRious({
                                element: qrCanvas,
                                value: armarPayloadQR(t),
                                size: 300,
                                level: 'L',
                                background: '#ffffff',
                                foreground: '#000000',
                                padding: 20
                            });
                            const qrDataUrl = qrCanvas.toDataURL('image/png');
                            const qrMm = Math.min(bodyH - 1.5, Math.max(15, (printConfig.qrSize / 70) * 19.5));

                            if (printConfig.qrPosition === 'IZQUIERDA' || printConfig.qrPosition === 'DERECHA') {
                                const qrX = printConfig.qrPosition === 'IZQUIERDA' ? (x + 1.2) : (x + colWidth - qrMm - 1.2);
                                const qrY = bodyY + (bodyH - qrMm) / 2;
                                doc.addImage(qrDataUrl, 'PNG', qrX, qrY, qrMm, qrMm);

                                const textAreaX = printConfig.qrPosition === 'IZQUIERDA' ? (x + qrMm + 1.8) : (x + 1.5);
                                const textAreaW = colWidth - qrMm - 3.2;
                                const textCenterX = textAreaX + (textAreaW / 2);

                                doc.setFont("helvetica", "bold");
                                doc.setTextColor(0, 0, 0);

                                let fontPt = printConfig.fontSizeCliente > 0 ? (printConfig.fontSizeCliente * 0.72) : 9.5;
                                doc.setFontSize(fontPt);
                                let lineas = doc.splitTextToSize(String(t.cliente || ''), textAreaW);

                                while ((lineas.length > 4 || palabrasCortadas(String(t.cliente || ''), textAreaW, doc)) && fontPt > 6.2) {
                                    fontPt -= 0.5;
                                    doc.setFontSize(fontPt);
                                    lineas = doc.splitTextToSize(String(t.cliente || ''), textAreaW);
                                }

                                const lineHeightMm = fontPt * 0.40;
                                const totalTextH = lineas.length * lineHeightMm;
                                let startTextY = bodyY + (bodyH - totalTextH) / 2 + (lineHeightMm * 0.78);

                                lineas.slice(0, 4).forEach((lin, lIdx) => {
                                    doc.text(lin, textCenterX, startTextY + (lIdx * lineHeightMm), { align: "center" });
                                });
                            } else if (printConfig.qrPosition === 'ARRIBA') {
                                const qrSmall = Math.min(qrMm, bodyH - 6);
                                doc.addImage(qrDataUrl, 'PNG', x + (colWidth - qrSmall) / 2, bodyY + 0.8, qrSmall, qrSmall);
                                doc.setFont("helvetica", "bold");
                                doc.setFontSize(7.5);
                                doc.setTextColor(0, 0, 0);
                                const lin = doc.splitTextToSize(String(t.cliente || ''), colWidth - 3);
                                doc.text(lin[0] || '', x + colWidth / 2, bodyY + qrSmall + 3.8, { align: "center" });
                            } else {
                                const qrBig = Math.min(colWidth - 4, bodyH - 1.5);
                                doc.addImage(qrDataUrl, 'PNG', x + (colWidth - qrBig) / 2, bodyY + (bodyH - qrBig) / 2, qrBig, qrBig);
                            }

                            doc.setFont("helvetica", "bold");
                            const esGrp = normalizarRubro(t.rubro) === 'GRUPAL';
                            doc.setFontSize(Math.min(esGrp ? 18 : 22, (printConfig.fontSizeCodigo || 24) * (esGrp ? 0.65 : 0.78)));
                            doc.setTextColor(220, 38, 38);
                            const codMostrar = obtenerCodigoVisibleTicket(t.id, t.rubro);
                            doc.text(codMostrar, x + colWidth / 2, y + rowHeight - (footerH / 2) + 2.5, { align: "center" });
                        }
                    });
                });

                doc.save(`Tickets_QR_${sedeActual}_${Date.now()}.pdf`);
            };

            const palabrasCortadas = (nombre, maxW, doc) => {
                const palabras = nombre.split(/\s+/);
                return palabras.some(p => doc.getTextWidth(p) > maxW);
            };

            const processTicketsForPrint = () => {
                const paddedQueue = [...ticketsQueue];
                const rem = paddedQueue.length % 24;
                if (rem > 0 || paddedQueue.length === 0) {
                    const toAdd = paddedQueue.length === 0 ? 24 : 24 - rem;
                    for (let i = 0; i < toAdd; i++) paddedQueue.push({ isEmpty: true });
                }
                const pages = [];
                for (let i = 0; i < paddedQueue.length; i += 24) pages.push(paddedQueue.slice(i, i + 24));
                return pages;
            };
            const printPages = processTicketsForPrint();

            // =====================================================================
            // PARÁMETROS DEL SISTEMA, INMUNIDAD POR CATEGORÍA Y PERMISOS POR USUARIO (GERENCIA)
            // =====================================================================
            const [nuevoParamValor, setNuevoParamValor] = React.useState('');

                        usuario: operadorNombre

                    if (data.status === 'success') {
                        if (data.parametros) aplicarCatalogoParametros(data.parametros, sedeActual);
                        setNuevoParamValor('');

                    alert('Error al guardar parámetro.');

                setIsLoading(false);

                setLoadingMsg('Actualizando parámetros...');

                    const data = await fetchGAS({

                        sedeAplica: 'GLOBAL',
                        usuario: operadorNombre

                        aplicarCatalogoParametros(data.parametros, sedeActual);

                } catch (e) {}
                setIsLoading(false);
            };

            const toggleInmunidadCategoriaCloud = async (categoria) => {
                if (!esGerente) return;
                const catUp = String(categoria).toUpperCase().trim();
                const yaEsInmune = categoriasInmunes.includes(catUp);
                const nuevaLista = yaEsInmune
                    ? categoriasInmunes.filter(c => c !== catUp)
                    : [...categoriasInmunes, catUp];

                setCategoriasInmunes(nuevaLista);
                try {
                    const data = await fetchGAS({
                        action: 'setInmunidadCategoria',
                        categoria: catUp,
                        inmune: !yaEsInmune,
                        categoriasInmunes: nuevaLista,
                        usuario: operadorNombre

                    if (data.status === 'success' && data.parametros) {
                        aplicarCatalogoParametros(data.parametros, sedeActual);
                        playSound('beep');

                    alert('Error al guardar configuración de inmunidad.');

            const actualizarPermisoUsuarioCloud = async (usuarioTarget, campo, valorBool) => {
                if (!esGerente) return;
                const uKey = String(usuarioTarget).toUpperCase().trim();

                    const data = await fetchGAS({
                        action: 'guardarPermisoUsuario',
                        usuarioTarget: uKey,
                        accesoSistema: actualizado.accesoSistema,
                        exportarPdf: actualizado.exportarPdf,
                        usuarioGerente: operadorNombre

                    if (data.status === 'success') {
                        if (data.parametros) aplicarCatalogoParametros(data.parametros, sedeActual);
                        playSound('beep');
                    }
                } catch (e) {
                    alert('Error al guardar permiso del usuario.');
                }
            };

            const forzarSyncUsuarios = async () => {

                setIsLoading(true);
                setLoadingMsg('Sincronizando usuarios activos, cargos, sedes y parámetros con el Script Maestro...');
                try {
                    const data = await fetchGAS({ action: 'syncUsuarios', sede: sedeActual });
                    if (data.status === 'success') {

                        if (Array.isArray(data.asesoresActivos || data.asesores)) {
                            setAsesoresActivos(limpiarListaAsesores(data.asesoresActivos || data.asesores));
                        }
                        alert(`✅ Sincronización completada.\nUsuarios activos sincronizados: ${data.sync?.usuariosSincronizados || 'OK'}`);
                    }
                } catch (e) {
                    alert('Error al sincronizar con el Script de Usuarios.');
                }
                setIsLoading(false);
            };

            // UI AUXILIARES Y MODALES
            const BadgeEstado = ({estado, inmune = false}) => {
                const colors = {
                    'ACTIVO': 'bg-green-100 text-green-700',
                    'MORA DURA': 'bg-red-100 text-red-700 font-bold',

                    'LISTA NEGRA': 'bg-slate-800 text-white font-bold',
                    'JUDICIAL': 'bg-purple-100 text-purple-800 font-bold',
                    'REPROGRAMADO': 'bg-amber-100 text-amber-800 font-bold'
                };
                return (
                    <span className="inline-flex items-center gap-1 flex-wrap">
